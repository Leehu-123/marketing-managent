services:
  web:
    build: .
    container_name: dafa_glass_backend
    restart: unless-stopped
    ports:
      - "3007:8000"
    shm_size: '1gb'
    volumes:
      - ./dafa_glass.db:/app/dafa_glass.db
      - ./uploads:/app/uploads
      - /var/www/marketing-management/client_automation:/app/client_automation
    env_file:
      - .env
    environment:
      - TZ=Asia/Ho_Chi_Minh
