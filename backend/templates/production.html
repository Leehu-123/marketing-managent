{% extends 'base.html' %}
{% block active_nav %}production{% endblock %}
{% block page_title %}Biên tập & Sản xuất Nội dung{% endblock %}

{% block content %}
<script>
function productionPage() {
    return {
    loading: true,
    campaigns: [],
    posts: [],
    plansMap: {},
    selectedPostId: null,
    selectedPost: null,
    editorTab: 'edit', // 'edit' or 'preview'
    searchQuery: '',
    filterCampaignId: '',
    filterStatus: 'Pending Review',
    filterPlatform: '',
    filterTime: '', // changed from '30' to '' to show all
    saving: false,
    approving: false,
    publishing: false,
    uploading: false,
    aiGeneratingImage: false,
    aiImagePrompt: '',
    showPromptEditor: false,
    inlineUploading: false,
    deleting: false,
    reverting: false,
    slotGenerating: {},
    restoredImageSlots: [],
    slotPromptTranslations: {},
    
    // Character counters warnings
    metaTitleLimit: 60,
    metaDescLimit: 160,

    async init() {
        await this.loadData();
    },

    async loadData() {
        this.loading = true;
        try {
            // 1. Tải chiến dịch
            const campRes = await fetch('/api/v1/campaigns/');
            const campaigns = await campRes.json();
            this.campaigns = campaigns.filter(c => c.campaign_type !== 'Video');
            
            // 2. Tải tất cả kế hoạch của các chiến dịch song song
            const plansPromises = this.campaigns.map(c => fetch(`/api/v1/campaigns/${c.id}/plans`).then(r => r.json()));
            const plansList = await Promise.all(plansPromises);
            
            // 3. Xây dựng bản đồ plans Map để tra cứu platform & format nhanh
            this.plansMap = {};
            plansList.forEach(plans => {
                plans.forEach(p => {
                    this.plansMap[p.id] = p;
                });
            });
            
            // 4. Tải danh sách tất cả các bài viết
            const postsRes = await fetch('/api/v1/posts/');
            const postsData = await postsRes.json();
            
            // 5. Kết hợp thông tin post với plan tương ứng
            this.posts = postsData.map(post => {
                const plan = this.plansMap[post.content_plan_id];
                return {
                    ...post,
                    platform: plan ? plan.platform : 'Web',
                    format: plan ? plan.format : 'Long article',
                    campaign_id: plan ? plan.campaign_id : null,
                    scheduled_at: plan ? plan.scheduled_at : null
                };
            });
            
            // Tự động chọn bài viết đầu tiên
            if (this.posts.length > 0) {
                // Check xem url có param id ko
                const urlParams = new URLSearchParams(window.location.search);
                const postIdParam = urlParams.get('id');
                if (postIdParam) {
                    this.selectPost(parseInt(postIdParam));
                } else {
                    this.selectPost(this.posts[0].id);
                }
            }
        } catch (err) {
            console.error('Load production data error:', err);
            window.showToast('Không thể tải dữ liệu bài viết', 'error');
        } finally {
            this.loading = false;
        }
    },

    normalizeBodyHtml(body) {
        return (body || '').replace(/\\x3C/g, '<').replace(/\\x3E/g, '>');
    },

    async selectPost(id) {
        this.selectedPostId = id;
        this.selectedPost = null;
        try {
            const res = await fetch(`/api/v1/posts/${id}`);
            if (!res.ok) throw new Error('API Error');
            const postDetails = await res.json();
            postDetails.body = this.normalizeBodyHtml(postDetails.body);
            this.restoredImageSlots = [];
            this.slotPromptTranslations = {};
            
            // Đính kèm platform và format
            const plan = this.plansMap[postDetails.content_plan_id];
            this.selectedPost = {
                ...postDetails,
                platform: plan ? plan.platform : 'Web',
                format: plan ? plan.format : 'Long article',
                campaign_id: plan ? plan.campaign_id : null,
                scheduled_at: plan ? plan.scheduled_at : null
            };
        } catch (err) {
            console.error('Select post error:', err);
            window.showToast('Không thể tải chi tiết bài viết', 'error');
        }
    },

    async savePost(silent) {
        if (!this.selectedPost) return;
        this.selectedPost.body = this.normalizeBodyHtml(this.selectedPost.body);
        this.saving = true;
        try {
            const res = await fetch(`/api/v1/posts/${this.selectedPost.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: this.selectedPost.title,
                    body: this.selectedPost.body,
                    meta_title: this.selectedPost.meta_title,
                    meta_description: this.selectedPost.meta_description,
                    image_prompt: this.selectedPost.image_prompt,
                    headline: this.selectedPost.headline,
                    subheadline: this.selectedPost.subheadline,
                    cta: this.selectedPost.cta,
                    utm_source: this.selectedPost.utm_source,
                    media_urls: this.selectedPost.media_urls,
                    fb_post_type: this.selectedPost.fb_post_type
                })
            });
            if (!res.ok) throw new Error('API Error');
            const updated = await res.json();
            this.selectedPost.media_url = updated.media_url;
            if (!silent) window.showToast('Đã lưu bài viết thành công', 'success');
            
            // Cập nhật scheduled_at nếu có thay đổi
            if (this.selectedPost._newScheduledAt) {
                const plan = this.plansMap[this.selectedPost.content_plan_id];
                if (plan) {
                    await fetch(`/api/v1/plans/${plan.id}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ scheduled_at: this.selectedPost._newScheduledAt })
                    });
                    this.selectedPost.scheduled_at = this.selectedPost._newScheduledAt;
                    plan.scheduled_at = this.selectedPost._newScheduledAt;
                }
            }
            
            this.posts = this.posts.map(p => p.id === this.selectedPost.id ? { ...p, title: this.selectedPost.title, status: this.selectedPost.status, scheduled_at: this.selectedPost.scheduled_at } : p);
        } catch (err) {
            console.error('Save post error:', err);
            if (!silent) window.showToast('Không thể lưu bài viết', 'error');
        } finally {
            this.saving = false;
        }
    },

    async approvePost() {
        if (!this.selectedPost) return;
        if (!confirm('Bạn có chắc duyệt bài viết này để đưa vào hàng đợi tự động xuất bản theo lịch đăng?')) return;
        
        this.approving = true;
        try {
            const res = await fetch(`/api/v1/posts/${this.selectedPost.id}/approve`, {
                method: 'POST'
            });
            if (!res.ok) throw new Error('API Error');
            const data = await res.json();
            
            this.selectedPost.status = 'Approved';
            window.showToast('Đã duyệt bài viết! Bài viết sẽ tự động xuất bản đúng giờ.', 'success');
            
            // Cập nhật list local
            this.posts = this.posts.map(p => p.id === this.selectedPost.id ? { ...p, status: 'Approved' } : p);
        } catch (err) {
            console.error('Approve post error:', err);
            window.showToast('Không thể duyệt bài viết', 'error');
        } finally {
            this.approving = false;
        }
    },

    async publishNow() {
        if (!this.selectedPost) return;
        if (!confirm('Bạn có chắc chắn muốn xuất bản bài viết này ngay lập tức?')) return;
        
        this.publishing = true;
        try {
            const res = await fetch(`/api/v1/posts/${this.selectedPost.id}/publish`, {
                method: 'POST'
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Lỗi khi đăng bài');
            
            this.selectedPost.status = 'Published';
            this.selectedPost.published_url = data.published_url;
            window.showToast('Đã xuất bản bài viết thành công!', 'success');
            
            this.posts = this.posts.map(p => p.id === this.selectedPost.id ? { ...p, status: 'Published', published_url: data.published_url } : p);
        } catch (err) {
            console.error('Publish now error:', err);
            window.showToast(err.message || 'Không thể đăng bài', 'error');
        } finally {
            this.publishing = false;
        }
    },

    async uploadMedia(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        
        const validExtensions = ['.mp4', '.png', '.jpg', '.jpeg', '.webp'];
        const formData = new FormData();
        
        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            const fileExt = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
            if (!validExtensions.includes(fileExt)) {
                window.showToast(`File ${file.name} không hỗ trợ!`, 'warning');
                continue;
            }
            formData.append('files', file);
        }

        if (!formData.has('files')) return;
        
        this.uploading = true;
        try {
            const res = await fetch(`/api/v1/posts/${this.selectedPost.id}/upload-media`, {
                method: 'POST',
                body: formData
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || 'Upload thất bại');
            }
            const updated = await res.json();
            this.selectedPost.media_url = updated.media_url;
            this.selectedPost.media_urls = updated.media_urls;
            window.showToast('Tải lên media thành công!', 'success');
            
            // Cập nhật list local
            this.posts = this.posts.map(p => p.id === this.selectedPost.id ? { ...p, media_url: updated.media_url, media_urls: updated.media_urls } : p);
        } catch (err) {
            console.error('Upload media error:', err);
            window.showToast(err.message || 'Không thể upload file', 'error');
        } finally {
            this.uploading = false;
            event.target.value = ''; // Reset input
        }
    },
    
    async removeMedia(index) {
        if (!this.selectedPost.media_urls) return;
        try {
            let urls = JSON.parse(this.selectedPost.media_urls);
            urls.splice(index, 1);
            this.selectedPost.media_urls = JSON.stringify(urls);
            if (urls.length > 0) {
                this.selectedPost.media_url = urls[0];
            } else {
                this.selectedPost.media_url = '';
            }
            // Tự động lưu ngay để DB đồng bộ
            await this.savePost(true);
            window.showToast('Đã xóa ảnh', 'success');
        } catch (e) {
            console.error('Lỗi khi xóa ảnh:', e);
            this.selectedPost.media_url = '';
            this.selectedPost.media_urls = '[]';
        }
    },

    async revertPost() {
        if (!this.selectedPost) return;
        if (!confirm('Chuyển bài viết về trạng thái Chờ duyệt để chỉnh sửa lại?')) return;
        this.reverting = true;
        try {
            const res = await fetch(`/api/v1/posts/${this.selectedPost.id}/revert`, { method: 'POST' });
            if (!res.ok) throw new Error('API Error');
            this.selectedPost.status = 'Pending Review';
            this.posts = this.posts.map(p => p.id === this.selectedPost.id ? { ...p, status: 'Pending Review' } : p);
            window.showToast('Đã chuyển bài về trạng thái chỉnh sửa', 'success');
        } catch (err) {
            console.error('Revert error:', err);
            window.showToast('Không thể chuyển trạng thái', 'error');
        } finally {
            this.reverting = false;
        }
    },

    async deletePost(postId) {
        if (!confirm('Bạn có chắc muốn xóa bài viết này? Hành động không thể hoàn tác!')) return;
        this.deleting = true;
        try {
            const res = await fetch(`/api/v1/posts/${postId}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('API Error');
            this.posts = this.posts.filter(p => p.id !== postId);
            if (this.selectedPostId === postId) {
                this.selectedPost = null;
                this.selectedPostId = null;
                if (this.posts.length > 0) this.selectPost(this.posts[0].id);
            }
            window.showToast('Đã xóa bài viết', 'success');
        } catch (err) {
            console.error('Delete post error:', err);
            window.showToast('Không thể xóa bài viết', 'error');
        } finally {
            this.deleting = false;
        }
    },

    getImageSlots() {
        if (!this.selectedPost) return [];
        const slotsMap = new Map();
        const body = this.normalizeBodyHtml(this.selectedPost.body || '');
        const slotRegex = new RegExp('\x3C!--\\s*IMAGE_SLOT_(\\d+)\\s*--\x3E', 'g');
        let match;
        while ((match = slotRegex.exec(body)) !== null) {
            const idx = parseInt(match[1]);
            const promptRegex = new RegExp('\x3C!--\\s*IMAGE_SLOT_PROMPT_' + idx + ':\\s*([\\s\\S]*?)\\s*--\x3E');
            const promptMatch = promptRegex.exec(body);
            const defaultCaption = promptMatch ? promptMatch[1].trim() : '';
            const cacheKey = idx + '|' + defaultCaption;
            const defaultPrompt = this.slotPromptTranslations[cacheKey] || this.buildEnglishImagePrompt(defaultCaption);
            slotsMap.set(idx, { index: idx, prompt: defaultPrompt, caption: defaultCaption, cacheKey: cacheKey, hasImage: false });
        }
        (this.restoredImageSlots || []).forEach(slot => {
            if (slot && slot.index && !slotsMap.has(slot.index)) {
                slotsMap.set(slot.index, { index: slot.index, prompt: slot.prompt || '', caption: slot.caption || '', cacheKey: slot.index + '|' + (slot.caption || ''), hasImage: false });
            }
        });
        return Array.from(slotsMap.values()).sort((a, b) => a.index - b.index);
    },

    async generateSlotImage(slot_index) {
        console.log('CLICKED GENERATE SLOT:', slot_index);
        const txt = document.getElementById('slot-prompt-' + slot_index);
        const cap = document.getElementById('slot-caption-' + slot_index);
        const promptText = txt ? txt.value : '';
        const captionText = cap ? cap.value : '';

        this.slotGenerating = { ...this.slotGenerating, [slot_index]: true };
        try {
            const res = await fetch(`/api/v1/posts/${this.selectedPost.id}/generate-slot-image`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ slot_index: slot_index, prompt: promptText, caption: captionText })
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || 'Tạo ảnh thất bại');
            }
            const data = await res.json();

            // Tự thay thế placeholder trong frontend
            if (data.url) {
                const placeholderRegex = new RegExp('\x3C!--\\s*IMAGE_SLOT_' + slot_index + '\\s*--\x3E', 'g');
                const prompt_placeholder_regex = new RegExp('\x3C!--\\s*IMAGE_SLOT_PROMPT_' + slot_index + ':[\\s\\S]*?--\x3E', 'g');
                
                const displayCaption = captionText || data.caption || promptText;
                const safePrompt = this.escapeAttr((promptText || '').substring(0, 240));
                const safeAlt = this.escapeAttr(displayCaption.substring(0, 80));
                const safeFig = this.escapeHtml(displayCaption.substring(0, 140));
                const safeCaptionAttr = this.escapeAttr(displayCaption.substring(0, 140));
                const img_tag = '\x3Cfigure class=\'inline-img-wrapper\' data-slot=\'' + slot_index + '\' data-prompt=\'' + safePrompt + '\' data-caption=\'' + safeCaptionAttr + '\'\x3E' +
                    '\x3Cimg src=\'' + data.url + '\' alt=\'' + safeAlt + '\' class=\'inline-img\'\x3E' +
                    '\x3Cfigcaption\x3E' + safeFig + '\x3C/figcaption\x3E\x3C/figure\x3E';
                
                let newBody = this.selectedPost.body.replace(placeholderRegex, img_tag);
                newBody = newBody.replace(prompt_placeholder_regex, ''); // Xóa prompt instruction
                
                this.selectedPost.body = newBody;
                this.restoredImageSlots = (this.restoredImageSlots || []).filter(slot => slot.index !== slot_index);
                
                // Nhanh chóng cập nhật TinyMCE nếu nó đang mở
                if (window.tinymce && tinymce.activeEditor) {
                    tinymce.activeEditor.setContent(newBody);
                }
            }
            
            await this.savePost(true);
            window.showToast(`Đã tạo ảnh cho vị trí #${slot_index}`, 'success');
        } catch (err) {
            console.error('Slot image error:', err);
            window.showToast(err.message || 'Không thể tạo ảnh', 'error');
        } finally {
            this.slotGenerating = { ...this.slotGenerating, [slot_index]: false };
        }
    },
    
    getParsedMediaUrls() {
        if (!this.selectedPost || !this.selectedPost.media_urls) return [];
        try {
            const urls = JSON.parse(this.selectedPost.media_urls);
            return Array.isArray(urls) ? urls : [];
        } catch (e) {
            return this.selectedPost.media_url ? [this.selectedPost.media_url] : [];
        }
    },

    getInlineImages() {
        if (!this.selectedPost || !this.selectedPost.body) return [];
        const images = [];
        const regex = new RegExp('\x3Cfigure[^>]*class=[\'\\"]([^\'\\"]*\\s)?inline-img-wrapper(\\s[^\'\\"]*)?[\'\\"][\\s\\S]*?\x3Cimg[^>]*src=[\'\\"]([^\'\\"]+)[\'\\"][^>]*>[\\s\\S]*?(?:\x3Cfigcaption[^>]*>([\\s\\S]*?)\x3C/figcaption>)?[\\s\\S]*?\x3C/figure>', 'gi');
        let match;
        while ((match = regex.exec(this.selectedPost.body)) !== null) {
            const html = match[0];
            images.push({
                html,
                url: match[3],
                caption: (match[4] || '').replace(/<[^>]+>/g, '').trim(),
                slot: parseInt(this.getAttrFromHtml(html, 'data-slot') || '0', 10) || null,
                prompt: this.getAttrFromHtml(html, 'data-prompt'),
                savedCaption: this.getAttrFromHtml(html, 'data-caption')
            });
        }
        return images;
    },

    async removeInlineImage(index) {
        const images = this.getInlineImages();
        const img = images[index];
        if (!img || !confirm('Xóa ảnh minh họa này khỏi nội dung bài?')) return;
        const slot = img.slot || (index + 1);
        const caption = img.savedCaption || img.caption || '';
        const prompt = img.prompt || this.buildEnglishImagePrompt(caption);
        const escapedPrompt = caption ? '\n' + '\x3C!-- IMAGE_SLOT_PROMPT_' + slot + ': ' + caption + ' --\x3E' : '';
        const restoredSlot = '\x3C!-- IMAGE_SLOT_' + slot + ' --\x3E' + escapedPrompt;
        this.selectedPost.body = this.normalizeBodyHtml(this.selectedPost.body).replace(img.html, restoredSlot);
        this.restoredImageSlots = [
            ...(this.restoredImageSlots || []).filter(s => s.index !== slot),
            { index: slot, prompt: prompt, caption: caption }
        ];
        if (window.tinymce && tinymce.activeEditor) {
            tinymce.activeEditor.setContent(this.selectedPost.body);
        }
        await this.savePost(true);
        await this.$nextTick();
        window.showToast('Đã xóa ảnh inline khỏi bài viết. Ô prompt tạo lại ảnh đã được mở lại.', 'success');
    },

    getAttrFromHtml(html, attr) {
        const m = (html || '').match(new RegExp(attr + "=['\\\"]([^'\\\"]+)['\\\"]", 'i'));
        return m ? this.decodeHtmlEntities(m[1]) : '';
    },

    escapeAttr(text) {
        return (text || '').replace(/&/g, '&amp;').replace(/'/g, '&#39;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    },

    escapeHtml(text) {
        return (text || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    },

    decodeHtmlEntities(text) {
        const textarea = document.createElement('textarea');
        textarea.innerHTML = text || '';
        return textarea.value;
    },

    buildEnglishImagePrompt(vietnameseCaption) {
        const caption = (vietnameseCaption || '').trim();
        if (!caption) return '';
        return 'Photorealistic professional image for a Vietnamese glass/construction article. Main subject based on the Vietnamese caption: ' + caption + '. Realistic architecture/interior/product photography, natural light, premium DAFA Glass mood, sharp details. No text, no letters, no logo, no watermark, no collage.';
    },

    async ensureEnglishSlotPrompt(slot) {
        if (!slot || !slot.caption || !slot.cacheKey) return;
        if (this.slotPromptTranslations[slot.cacheKey]) return;
        try {
            const res = await fetch('/api/v1/image-gen/translate-slot-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ caption: slot.caption, title: this.selectedPost ? this.selectedPost.title : '' })
            });
            if (!res.ok) return;
            const data = await res.json();
            if (data.prompt) {
                this.slotPromptTranslations = { ...this.slotPromptTranslations, [slot.cacheKey]: data.prompt };
                await this.$nextTick();
                const txt = document.getElementById('slot-prompt-' + slot.index);
                if (txt && (!txt.value || txt.value === slot.prompt)) txt.value = data.prompt;
            }
        } catch (err) {
            console.warn('Translate slot prompt failed:', err);
        }
    },

    openInlineImage(url) {
        if (!url) return;
        window.open(url, '_blank', 'noopener');
    },
    
    async previewImagePrompt() {
        if (!this.selectedPost) return;
        this.showPromptEditor = true;
        this.aiImagePrompt = 'Đang tạo prompt...';
        try {
            const res = await fetch('/api/v1/image-gen/preview-prompt', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    title: this.selectedPost.title,
                    body: this.selectedPost.body || '',
                    platform: this.selectedPost.platform
                })
            });
            if (!res.ok) throw new Error('API Error');
            const data = await res.json();
            this.aiImagePrompt = data.prompt;
        } catch (err) {
            console.error('Preview prompt error:', err);
            this.aiImagePrompt = this.selectedPost.image_prompt || 'Không thể tạo prompt';
        }
    },

    async aiGenerateImageFromButton() {
        if (!this.showPromptEditor) await this.previewImagePrompt();
        await this.aiGenerateImage();
    },

    async aiGenerateImage() {
        if (!this.selectedPost) return;
        this.aiGeneratingImage = true;
        try {
            const body = this.aiImagePrompt ? { custom_prompt: this.aiImagePrompt } : {};
            body.headline = this.selectedPost.headline || '';
            body.subheadline = this.selectedPost.subheadline || '';
            body.cta = this.selectedPost.cta || '';
            
            const res = await fetch(`/api/v1/image-gen/posts/${this.selectedPost.id}/generate`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            if (!res.ok) {
                const err = await res.json();
                throw new Error(err.detail || 'Tạo ảnh thất bại');
            }
            const data = await res.json();
            
            // Reload post data to get updated media_urls
            await this.selectPost(this.selectedPost.id);
            this.showPromptEditor = false;
            window.showToast('AI đã tạo ảnh thành công!', 'success');
        } catch (err) {
            console.error('AI generate image error:', err);
            window.showToast(err.message || 'Không thể tạo ảnh AI', 'error');
        } finally {
            this.aiGeneratingImage = false;
        }
    },

    async uploadInlineImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        const validExts = ['.png', '.jpg', '.jpeg', '.webp', '.gif'];
        const ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
        if (!validExts.includes(ext)) {
            window.showToast('Chỉ hỗ trợ .png, .jpg, .jpeg, .webp, .gif', 'warning');
            return;
        }
        
        const formData = new FormData();
        formData.append('file', file);
        
        this.inlineUploading = true;
        try {
            const res = await fetch(`/api/v1/posts/${this.selectedPost.id}/upload-inline-image`, {
                method: 'POST',
                body: formData
            });
            if (!res.ok) throw new Error('Upload thất bại');
            const data = await res.json();
            
            // Insert img tag at the end of body
            const safeTitle = (this.selectedPost.title || '').replace(/'/g, '');
            const imgTag = '\n\x3Cfigure class=\'inline-img-wrapper\'\x3E\x3Cimg src=\'' + data.url + '\' alt=\'' + safeTitle + '\' class=\'inline-img\'\x3E\x3Cfigcaption\x3EMinh họa\x3C/figcaption\x3E\x3C/figure\x3E\n';
            this.selectedPost.body = (this.selectedPost.body || '') + imgTag;
            window.showToast('Đã chèn ảnh minh họa vào nội dung!', 'success');
        } catch (err) {
            console.error('Inline image upload error:', err);
            window.showToast('Không thể upload ảnh', 'error');
        } finally {
            this.inlineUploading = false;
            event.target.value = '';
        }
    },

    getFilteredPosts() {
        const now = new Date();
        return this.posts.filter(p => {
            const matchesSearch = (p.title || '').toLowerCase().includes(this.searchQuery.toLowerCase());
            const matchesCampaign = this.filterCampaignId ? p.campaign_id == this.filterCampaignId : true;
            const matchesStatus = this.filterStatus ? p.status === this.filterStatus : true;
            const matchesPlatform = this.filterPlatform ? p.platform === this.filterPlatform : true;
            
            let matchesTime = true;
            if (this.filterTime && p.scheduled_at) {
                const postDate = new Date(p.scheduled_at);
                const diffTime = Math.abs(now - postDate);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                if (this.filterTime === '7') matchesTime = diffDays <= 7;
                else if (this.filterTime === '30') matchesTime = diffDays <= 30;
                else if (this.filterTime === '90') matchesTime = diffDays <= 90;
            }

            return matchesSearch && matchesCampaign && matchesStatus && matchesPlatform && matchesTime;
        });
    },

    getStatusClass(status) {
        switch(status) {
            case 'Pending Review': return 'bg-amber-500/10 text-amber-400 border border-amber-500/20';
            case 'Approved': return 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
            case 'Published': return 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/20';
            case 'Failed': return 'bg-red-500/10 text-red-400 border border-red-500/20';
            default: return 'bg-slate-500/10 text-slate-400 border border-slate-500/20';
        }
    },
    
    getStatusLabel(status) {
        switch(status) {
            case 'Pending Review': return 'Chờ duyệt';
            case 'Approved': return 'Đã duyệt';
            case 'Published': return 'Đã đăng';
            case 'Failed': return 'Thất bại';
            default: return status;
        }
    },

    formatDateTime(isoStr) {
        if (!isoStr) return '';
        const d = new Date(isoStr);
        const hours = String(d.getHours()).padStart(2, '0');
        const mins = String(d.getMinutes()).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${hours}:${mins} ${day}/${month}/${year}`;
    },

    formatHeadings(headings) {
        if (!headings) return '<p class=\'text-sm text-slate-500\'>Chưa có cấu trúc headings.</p>';
        try {
            const obj = JSON.parse(headings);
            let html = '';
            if (obj.H1) html += `<div class='text-white font-bold mb-2 p-2 rounded bg-white/[0.02] border border-white/[0.04]'><span class='text-xs text-teal-400 font-mono mr-2'>H1</span>${obj.H1}</div>`;
            if (obj.H2 && Array.isArray(obj.H2)) {
                obj.H2.forEach(h2 => {
                    html += `<div class='text-slate-300 ml-4 mb-1.5 p-1.5 rounded bg-white/[0.01] border border-white/[0.02]'><span class='text-xs text-purple-400 font-mono mr-2'>H2</span>${h2}</div>`;
                });
            }
            if (obj.H3 && Array.isArray(obj.H3)) {
                obj.H3.forEach(h3 => {
                    html += `<div class='text-slate-400 ml-8 mb-1'><span class='text-xs text-cyan-400 font-mono mr-2'>H3</span>${h3}</div>`;
                });
            }
            return html || headings;
        } catch (e) {
            return `<div class='text-slate-300 whitespace-pre-wrap'>${headings}</div>`;
        }
    }
}
}
