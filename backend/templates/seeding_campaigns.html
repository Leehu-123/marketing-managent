{% extends 'base.html' %}
{% block title %}Chiến dịch Seeding - DAFA Glass{% endblock %}
{% block page_title %}Chiến dịch Seeding{% endblock %}

{% block content %}
<div x-data="{
    campaigns: [],
    loading: true,
    showModal: false,
    showLogsModal: false,
    logs: [],
    logsLoading: false,
    logsAutoRefresh: true,
    logsInterval: null,
    tasksInterval: null,
    viewingCampaign: null,
    newCampaign: {
        name: '',
        platform: 'facebook',
        campaign_type: 'COMMENT',
        target_urls: '',
        ai_instructions: 'Hãy đóng vai một khách hàng đang tìm hiểu sản phẩm nội thất, vào khen hoặc hỏi han rất tự nhiên, tuyệt đối không lộ là seeder.',
        post_content: '',
        media_urls: [],
        daily_schedule_time: '',
        is_daily_repeat: false,
        account_ids: [],
    },
    
    editingId: null,
    accounts: [],
    
    showTasksModal: false,
    campaignTasks: [],
    viewingCampaignName: '',
    taskFilter: 'current',

    filteredTasks() {
        if (!this.viewingCampaign || !this.viewingCampaign.is_daily_repeat || this.taskFilter === 'all') {
            return this.campaignTasks;
        }
        if (!this.campaignTasks || !this.campaignTasks.length) return [];
        // Lọc các task thuộc ngày gần nhất
        const dates = this.campaignTasks.map(t => (t.created_at || '').substring(0, 10)).filter(d => d);
        if (!dates.length) return this.campaignTasks;
        const latestDate = dates.sort().reverse()[0];
        return this.campaignTasks.filter(t => (t.created_at || '').startsWith(latestDate));
    },
    
    isSaving: false,
    toolStatus: 'idle',
    toolShowBrowser: false,

    async init() {
        await this.loadCampaigns();
        await this.loadAccounts();
        await this.checkToolStatus();
        
        // Auto refresh tool status and campaigns periodically (mỗi 3 giây)
        setInterval(() => {
            this.checkToolStatus();
            this.loadCampaigns(false); // background refresh
        }, 3000);
    },

    async viewTasks(camp) {
        this.viewingCampaign = camp;
        this.viewingCampaignName = camp.name;
        await this.fetchCampaignTasks(camp.id);
        this.showTasksModal = true;
        
        if (this.tasksInterval) clearInterval(this.tasksInterval);
        this.tasksInterval = setInterval(async () => {
            if (this.showTasksModal) {
                await this.fetchCampaignTasks(camp.id);
            } else {
                clearInterval(this.tasksInterval);
            }
        }, 3000);
    },

    async fetchCampaignTasks(campId) {
        try {
            const res = await fetch(`/api/v1/seeding/campaigns/${campId}/tasks`);
            if (res.ok) {
                this.campaignTasks = await res.json();
            }
        } catch (e) {}
    },

    async viewToolLogs() {
        this.showLogsModal = true;
        await this.fetchToolLogs();
        if (this.logsInterval) clearInterval(this.logsInterval);
        this.logsInterval = setInterval(() => {
            if (this.showLogsModal && this.logsAutoRefresh) {
                this.fetchToolLogs();
            } else if (!this.showLogsModal) {
                clearInterval(this.logsInterval);
            }
        }, 3000);
    },

    async fetchToolLogs() {
        this.logsLoading = true;
        try {
            const res = await fetch('/api/v1/seeding/tool/logs?limit=100');
            if (res.ok) {
                const data = await res.json();
                this.logs = data.logs || [];
                this.$nextTick(() => {
                    const el = document.getElementById('tool-logs-container');
                    if (el) el.scrollTop = el.scrollHeight;
                });
            }
        } catch (e) {
            console.error(e);
        } finally {
            this.logsLoading = false;
        }
    },

    async checkToolStatus() {
        try {
            const res = await fetch('/api/v1/seeding/tool/status');
            if (res.ok) {
                const data = await res.json();
                this.toolStatus = data.status;
            }
        } catch (e) {}
    },
    
    async startTool() {
        try {
            const res = await fetch('/api/v1/seeding/tool/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    platform: 'facebook',
                    show_browser: this.toolShowBrowser
                })
            });
            const data = await res.json();
            if (res.ok && data.status === 'success' || data.status === 'running') {
                window.showToast(data.message || 'Đã khởi động Tool');
                this.toolStatus = 'running';
            } else {
                window.showToast(data.message || 'Lỗi khi khởi động', 'error');
            }
        } catch (e) {
            window.showToast('Lỗi kết nối', 'error');
        }
    },
    
    async stopTool() {
        try {
            const res = await fetch('/api/v1/seeding/tool/stop', { method: 'POST' });
            if (res.ok) {
                window.showToast('Đã dừng Tool');
                this.toolStatus = 'idle';
            }
        } catch (e) {}
    },

    async loadAccounts() {
        try {
            const res = await fetch('/api/v1/seeding/accounts');
            if (res.ok) {
                this.accounts = await res.json();
            }
        } catch (e) {
            console.error('Lỗi tải danh sách tài khoản', e);
        }
    },
    
    async loadCampaigns(showLoading = true) {
        if (showLoading) this.loading = true;
        try {
            const res = await fetch('/api/v1/seeding/campaigns');
            if (res.ok) {
                this.campaigns = await res.json();
            }
        } catch (e) {
            console.error(e);
        } finally {
            if (showLoading) this.loading = false;
        }
    },
    
    openAddModal() {
        this.editingId = null;
        this.newCampaign = {name: '', platform: 'facebook', campaign_type: 'COMMENT', target_urls: '', ai_instructions: '', account_ids: [], post_content: '', media_urls: [], daily_schedule_time: '', is_daily_repeat: false};
        this.showModal = true;
    },
    
    editCampaign(camp) {
        this.editingId = camp.id;
        let urls = '';
        if (camp.target_urls) {
            try { urls = JSON.parse(camp.target_urls).join('\n'); } catch(e) { urls = camp.target_urls; }
        }
        let accIds = [];
        if (camp.account_ids) {
            try { 
                let parsed = JSON.parse(camp.account_ids);
                accIds = Array.isArray(parsed) ? parsed : [parsed];
            } catch(e) {
                accIds = [];
            }
        }
        this.newCampaign = {
            name: camp.name,
            platform: camp.platform,
            campaign_type: camp.campaign_type,
            target_urls: urls,
            ai_instructions: camp.ai_instructions || '',
            post_content: camp.post_content || '',
            daily_schedule_time: camp.daily_schedule_time || '',
            is_daily_repeat: camp.is_daily_repeat || false,
            media_urls: camp.media_urls ? (typeof camp.media_urls === 'string' ? JSON.parse(camp.media_urls) : camp.media_urls) : [],
            account_ids: accIds,
        };
        this.showModal = true;
    },
    
    async saveCampaign(shouldRerun = false) {
        if (this.isSaving) return;
        if(!this.newCampaign.name || !this.newCampaign.target_urls) {
            window.showToast('Vui lòng nhập tên chiến dịch và link mục tiêu', 'error');
            return;
        }
        this.isSaving = true;
        try {
            let urls = this.newCampaign.target_urls.split('\n').map(u => u.trim()).filter(u => u);
            let payload = {
                ...this.newCampaign,
                target_urls: JSON.stringify(urls),
                account_ids: JSON.stringify(this.newCampaign.account_ids),
                media_urls: JSON.stringify(this.newCampaign.media_urls),
                rerun: shouldRerun
            };
            
            const url = this.editingId ? `/api/v1/seeding/campaigns/${this.editingId}` : '/api/v1/seeding/campaigns';
            const method = this.editingId ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                window.showToast(this.editingId ? (shouldRerun ? 'Đã lưu và kích hoạt chạy lại chiến dịch!' : 'Cập nhật chiến dịch thành công!') : 'Khởi tạo chiến dịch thành công!');
                this.showModal = false;
                this.editingId = null;
                this.newCampaign = {name: '', platform: 'facebook', campaign_type: 'COMMENT', target_urls: '', ai_instructions: '', account_ids: [], post_content: '', media_urls: [], daily_schedule_time: '', is_daily_repeat: false};
                await this.loadCampaigns();
                if (shouldRerun && this.toolStatus !== 'running') {
                    await this.startTool();
                }
            } else {
                window.showToast('Lỗi khi lưu chiến dịch', 'error');
            }
        } catch (e) {
            window.showToast('Lỗi hệ thống', 'error');
        } finally {
            this.isSaving = false;
        }
    },

    async rerunCampaign(campId) {
        if(!confirm('Bạn có chắc muốn chạy lại chiến dịch này từ đầu? Tất cả nhiệm vụ sẽ được tạo mới và bắt đầu chạy.')) return;
        try {
            const res = await fetch(`/api/v1/seeding/campaigns/${campId}/rerun`, { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                window.showToast(data.message || 'Đã kích hoạt chạy lại chiến dịch!');
                await this.loadCampaigns();
                if (this.toolStatus !== 'running') {
                    await this.startTool();
                }
            } else {
                window.showToast('Lỗi: ' + (data.detail || 'Không xác định'), 'error');
            }
        } catch (e) {
            window.showToast('Lỗi kết nối', 'error');
        }
    },

    async toggleDailyRepeat(campId, enable) {
        const actionText = enable ? 'bật lại lịch đăng hàng ngày' : 'dừng lịch đăng hàng ngày';
        if(!confirm(`Bạn có chắc muốn ${actionText} cho chiến dịch này?`)) return;
        try {
            const res = await fetch(`/api/v1/seeding/campaigns/${campId}/toggle-daily`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ is_daily_repeat: enable })
            });
            const data = await res.json();
            if (res.ok) {
                window.showToast(data.message || 'Cập nhật lịch thành công');
                await this.loadCampaigns();
            } else {
                window.showToast('Lỗi: ' + (data.detail || 'Không xác định'), 'error');
            }
        } catch (e) {
            window.showToast('Lỗi kết nối', 'error');
        }
    },

    async runNow(campId) {
        if(!confirm('Bạn muốn chạy ngay chiến dịch này?')) return;
        try {
            const res = await fetch(`/api/v1/seeding/campaigns/${campId}/run-now`, { method: 'POST' });
            const data = await res.json();
            if (res.ok) {
                window.showToast(data.message || 'Đã kích hoạt chiến dịch!');
                await this.loadCampaigns();
                // Tự khởi động tool nếu chưa chạy
                if (this.toolStatus !== 'running') {
                    await this.startTool();
                }
            } else {
                window.showToast('Lỗi: ' + (data.detail || 'Không xác định'), 'error');
            }
        } catch (e) {
            window.showToast('Lỗi hệ thống', 'error');
        }
    },
    
    async deleteCampaign(id) {
        if(!confirm('Bạn có chắc chắn muốn xoá chiến dịch này và toàn bộ dữ liệu đi kèm?')) return;
        try {
            const res = await fetch(`/api/v1/seeding/campaigns/${id}`, { method: 'DELETE' });
            if (res.ok) {
                window.showToast('Đã xoá chiến dịch thành công');
                await this.loadCampaigns();
            } else {
                window.showToast('Lỗi khi xoá chiến dịch', 'error');
            }
        } catch (e) {
            window.showToast('Lỗi kết nối', 'error');
        }
    },
    
    async uploadMedia(event) {
        const files = event.target.files;
        if (!files.length) return;
        
        const formData = new FormData();
        for (let f of files) {
            formData.append('files', f);
        }
        
        try {
            const res = await fetch('/api/v1/seeding/upload-media', {
                method: 'POST',
                body: formData
            });
            if (res.ok) {
                const data = await res.json();
                this.newCampaign.media_urls = [...this.newCampaign.media_urls, ...data.urls];
                window.showToast(`Đã upload ${data.urls.length} file`);
            } else {
                window.showToast('Lỗi upload media', 'error');
            }
        } catch (e) {
            window.showToast('Lỗi kết nối', 'error');
        }
    },
    
    removeMedia(index) {
        this.newCampaign.media_urls.splice(index, 1);
    },
    
    async generateReplies(campId) {
        if (!campId) {
            window.showToast('Vui lòng lưu chiến dịch trước', 'error');
            return;
        }
        window.showToast('Đang sinh kịch bản reply chéo...', 'info');
        try {
            const res = await fetch(`/api/v1/seeding/campaigns/${campId}/generate-replies`, {
                method: 'POST'
            });
            const data = await res.json();
            if (res.ok) {
                window.showToast(data.message || 'Đã sinh kịch bản thành công!');
                await this.loadCampaigns();
            } else {
                window.showToast(data.detail || 'Lỗi khi sinh kịch bản', 'error');
            }
        } catch (e) {
            window.showToast('Lỗi kết nối', 'error');
        }
    }
}" class="max-w-6xl mx-auto space-y-6">

    <div class="flex justify-between items-center">
        <h2 class="text-xl font-heading font-semibold text-white">Quản lý Chiến dịch</h2>
        <button @click="openAddModal()" class="btn btn-primary px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg transition">
            + Tạo Chiến dịch
        </button>
    </div>

    <!-- Bảng điều khiển Tool Automation -->
    <div class="bg-surface-secondary border border-slate-700 rounded-xl p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
        <div>
            <h3 class="font-semibold text-white mb-1">🤖 Client Automation Tool</h3>
            <p class="text-sm text-slate-400">Trạng thái: 
                <span x-show="toolStatus === 'running'" class="text-emerald-400 font-medium ml-1">● Đang chạy</span>
                <span x-show="toolStatus !== 'running'" class="text-slate-500 font-medium ml-1">○ Đang tắt</span>
            </p>
        </div>
        <div class="flex items-center gap-3">
            <button @click="viewToolLogs()" class="px-3.5 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-600 rounded-lg transition font-medium text-sm flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                Nhật ký Tool
            </button>
            <button x-show="toolStatus !== 'running'" @click="startTool()" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-lg transition font-medium flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                Khởi động Tool
            </button>
            <button x-show="toolStatus === 'running'" @click="stopTool()" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg transition font-medium flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="none"><rect x="6" y="6" width="12" height="12"></rect></svg>
                Dừng Tool
            </button>
        </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <template x-if="loading">
            <div class="text-slate-400 col-span-full">Đang tải danh sách...</div>
        </template>
        <template x-if="!loading && campaigns.length === 0">
            <div class="text-slate-400 col-span-full">Chưa có chiến dịch seeding nào.</div>
        </template>
        
        <template x-for="camp in campaigns" :key="camp.id">
            <div class="bg-surface-secondary border border-slate-700/50 rounded-xl p-5 hover:border-slate-500 transition flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-semibold text-white text-lg" x-text="camp.name"></h3>
                        <div class="flex flex-wrap items-center gap-1.5">
                            <span class="px-2 py-0.5 text-xs rounded bg-slate-800 text-slate-300" x-text="camp.platform"></span>
                            <span class="px-2 py-0.5 text-xs rounded" :class="{
                                'bg-blue-500/10 text-blue-400': camp.campaign_type === 'COMMENT',
                                'bg-purple-500/10 text-purple-400': camp.campaign_type === 'REPLY_COMMENT',
                                'bg-amber-500/10 text-amber-400': camp.campaign_type === 'POST_GROUP'
                            }" x-text="{'COMMENT': '💬 Comment', 'REPLY_COMMENT': '↩️ Reply', 'POST_GROUP': '📢 Nhóm'}[camp.campaign_type] || camp.campaign_type"></span>
                            <span x-show="camp.is_daily_repeat" class="px-2 py-0.5 text-xs rounded bg-emerald-500/10 text-emerald-400 font-medium border border-emerald-500/20" title="Đang bật lặp lại hàng ngày">🔄 <span x-text="camp.daily_schedule_time"></span></span>
                            <span x-show="!camp.is_daily_repeat && camp.daily_schedule_time" class="px-2 py-0.5 text-xs rounded bg-amber-500/10 text-amber-400 font-medium border border-amber-500/20" title="Đã tạm dừng lịch lặp lại hàng ngày">⏸️ Tạm dừng: <span x-text="camp.daily_schedule_time"></span></span>
                        </div>
                    </div>
                    <div class="text-sm text-slate-400 mb-4 line-clamp-2" x-text="camp.ai_instructions"></div>
                    
                    <!-- Danh sách link mục tiêu -->
                    <div class="mb-4 space-y-1" x-data="{ 
                        getUrls() { 
                            try { return JSON.parse(camp.target_urls); } 
                            catch(e) { return camp.target_urls ? [camp.target_urls] : []; } 
                        } 
                    }">
                        <p class="text-xs text-slate-500 font-medium uppercase tracking-wider mb-2">Link mục tiêu (<span x-text="getUrls().length"></span>)</p>
                        <div class="max-h-24 overflow-y-auto space-y-1.5 pr-1">
                            <template x-for="url in getUrls()">
                                <a :href="url" target="_blank" class="block text-xs text-blue-400 hover:text-blue-300 hover:underline truncate bg-slate-800/50 p-1.5 rounded" x-text="url"></a>
                            </template>
                        </div>
                    </div>
                    
                    <!-- Thanh tiến trình thời gian thực (Live Progress Bar) -->
                    <div class="mb-4 pt-3 border-t border-slate-700/50">
                        <!-- Trường hợp 1: Chiến dịch hàng ngày (Hiển thị nổi bật tiến trình LẦN CHẠY HIỆN TẠI) -->
                        <div x-show="camp.is_daily_repeat && (camp.current_run_total > 0)" class="space-y-2">
                            <div class="flex justify-between items-center text-xs">
                                <span class="text-emerald-400 font-semibold flex items-center gap-1.5">
                                    <span class="relative flex h-2 w-2">
                                        <span x-show="camp.status === 'running'" class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                    </span>
                                    📅 Lần chạy hôm nay (<span x-text="camp.current_run_date || 'Hiện tại'"></span>): 
                                    <span class="text-white font-bold ml-1" x-text="`${(camp.current_run_completed || 0) + (camp.current_run_failed || 0)}/${camp.current_run_total} (${camp.current_run_percent || 0}%)`"></span>
                                </span>
                                <div class="flex items-center gap-1.5 text-[11px]">
                                    <span class="text-emerald-400 font-medium" x-text="`${camp.current_run_completed || 0} xong`"></span>
                                    <span x-show="camp.current_run_failed > 0" class="text-rose-400 font-medium" x-text="`• ${camp.current_run_failed} lỗi`"></span>
                                </div>
                            </div>
                            
                            <div class="w-full bg-slate-800 rounded-full h-2.5 overflow-hidden flex shadow-inner">
                                <div class="bg-emerald-500 h-2.5 transition-all duration-500" :style="`width: ${((camp.current_run_completed || 0) / (camp.current_run_total || 1)) * 100}%`"></div>
                                <div class="bg-rose-500 h-2.5 transition-all duration-500" :style="`width: ${((camp.current_run_failed || 0) / (camp.current_run_total || 1)) * 100}%`"></div>
                                <div class="bg-amber-500/80 h-2.5 transition-all duration-500" :style="`width: ${((camp.current_run_in_progress || 0) / (camp.current_run_total || 1)) * 100}%`"></div>
                            </div>

                            <div class="flex justify-between items-center text-[11px] text-slate-400 pt-0.5">
                                <span>Tổng tích luỹ qua các ngày:</span>
                                <span class="text-slate-300 font-medium" x-text="`${camp.completed_tasks || 0}/${camp.total_tasks || 0} bài thành công`"></span>
                            </div>
                        </div>

                        <!-- Trường hợp 2: Chiến dịch một lần thông thường -->
                        <div x-show="!camp.is_daily_repeat && (camp.total_tasks > 0)">
                            <div class="flex justify-between items-center text-xs mb-1.5">
                                <span x-show="camp.status === 'running'" class="text-emerald-400 font-medium flex items-center gap-1.5">
                                    <span class="relative flex h-2 w-2">
                                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                                    </span>
                                    Đang chạy: <span x-text="`${(camp.completed_tasks || 0) + (camp.failed_tasks || 0)}/${camp.total_tasks} (${camp.progress_percent || 0}%)`"></span>
                                </span>
                                <span x-show="camp.status === 'completed'" class="text-blue-400 font-medium flex items-center gap-1">
                                    <span>✅</span> Hoàn thành: <span x-text="`${camp.completed_tasks || 0}/${camp.total_tasks}`"></span>
                                </span>
                                <span x-show="camp.status === 'pending'" class="text-amber-400 font-medium flex items-center gap-1">
                                    <span>⏳</span> Sẵn sàng: <span x-text="`${camp.total_tasks} tasks`"></span>
                                </span>
                                <span x-show="camp.status === 'failed'" class="text-rose-400 font-medium flex items-center gap-1">
                                    <span>❌</span> Thất bại: <span x-text="`${camp.failed_tasks || 0}/${camp.total_tasks}`"></span>
                                </span>

                                <div class="flex items-center gap-1.5 text-[11px]">
                                    <span class="text-emerald-400 font-medium" x-text="`${camp.completed_tasks || 0} xong`"></span>
                                    <span x-show="camp.failed_tasks > 0" class="text-rose-400 font-medium" x-text="`• ${camp.failed_tasks} lỗi`"></span>
                                </div>
                            </div>
                            
                            <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden flex shadow-inner">
                                <div class="bg-emerald-500 h-2 transition-all duration-500" :style="`width: ${((camp.completed_tasks || 0) / (camp.total_tasks || 1)) * 100}%`"></div>
                                <div class="bg-rose-500 h-2 transition-all duration-500" :style="`width: ${((camp.failed_tasks || 0) / (camp.total_tasks || 1)) * 100}%`"></div>
                                <div class="bg-amber-500/80 h-2 transition-all duration-500" :style="`width: ${((camp.in_progress_tasks || 0) / (camp.total_tasks || 1)) * 100}%`"></div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <div class="flex items-center justify-between text-sm pt-3 border-t border-slate-700/40 mt-auto">
                    <div class="flex items-center gap-1.5 text-slate-400 text-xs">
                        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                        <span x-text="new Date(camp.created_at).toLocaleDateString('vi-VN')"></span>
                    </div>
                    <div class="flex flex-wrap items-center gap-1.5">
                        <button @click="viewTasks(camp)" class="text-xs text-blue-400 hover:text-blue-300 font-medium px-2 py-1 rounded bg-blue-500/10 hover:bg-blue-500/20 transition flex items-center gap-1">
                            <span>👁️</span> Tiến trình
                        </button>
                        
                        <!-- Yêu cầu 1: Nút Sửa luôn hiển thị khi chiến dịch không chạy -->
                        <button x-show="camp.status !== 'running'" @click="editCampaign(camp)" class="text-xs text-rose-400 hover:text-rose-300 font-medium px-2 py-1 rounded bg-rose-500/10 hover:bg-rose-500/20 transition flex items-center gap-1">
                            <span>✏️</span> Sửa
                        </button>

                        <!-- Yêu cầu 1: Nút Chạy lại cho chiến dịch completed/failed -->
                        <button x-show="camp.status === 'completed' || camp.status === 'failed'" @click="rerunCampaign(camp.id)" class="text-xs text-amber-400 hover:text-amber-300 font-medium px-2 py-1 rounded bg-amber-500/10 hover:bg-amber-500/20 transition flex items-center gap-1" title="Khởi tạo lại tất cả task và chạy lại từ đầu">
                            <span>🔄</span> Chạy lại
                        </button>

                        <!-- Nút Chạy ngay cho chiến dịch pending -->
                        <button x-show="camp.status === 'pending'" @click="runNow(camp.id)" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium px-2 py-1 rounded bg-emerald-500/10 hover:bg-emerald-500/20 transition flex items-center gap-1">
                            <span>⚡</span> Chạy ngay
                        </button>

                        <!-- Yêu cầu 3: Nút Dừng chạy theo ngày -->
                        <button x-show="camp.is_daily_repeat" @click="toggleDailyRepeat(camp.id, false)" class="text-xs text-amber-400 hover:text-amber-300 font-medium px-2 py-1 rounded bg-amber-500/10 hover:bg-amber-500/20 transition flex items-center gap-1" title="Dừng tự động chạy bài hàng ngày">
                            <span>⏸️</span> Dừng ngày
                        </button>

                        <!-- Yêu cầu 3: Nút Bật lại chạy theo ngày -->
                        <button x-show="!camp.is_daily_repeat && camp.daily_schedule_time" @click="toggleDailyRepeat(camp.id, true)" class="text-xs text-emerald-400 hover:text-emerald-300 font-medium px-2 py-1 rounded bg-emerald-500/10 hover:bg-emerald-500/20 transition flex items-center gap-1" title="Tiếp tục tự động chạy bài hàng ngày">
                            <span>▶️</span> Bật ngày
                        </button>

                        <button x-show="camp.campaign_type === 'REPLY_COMMENT' && (camp.status === 'pending' || camp.status === 'failed')" @click="generateReplies(camp.id)" class="text-xs text-purple-400 hover:text-purple-300 font-medium px-2 py-1 rounded bg-purple-500/10 transition">🤖 Sinh Reply</button>
                        
                        <button @click="deleteCampaign(camp.id)" class="text-xs text-slate-400 hover:text-red-400 font-medium px-2 py-1 rounded bg-slate-800 hover:bg-red-500/10 transition">Xoá</button>
                        
                        <span class="px-2 py-1 rounded font-medium text-xs cursor-pointer" @click="viewTasks(camp)" :class="{
                            'bg-amber-500/10 text-amber-500': camp.status == 'pending',
                            'bg-emerald-500/10 text-emerald-500 animate-pulse': camp.status == 'running',
                            'bg-blue-500/10 text-blue-500': camp.status == 'completed',
                            'bg-red-500/10 text-red-500': camp.status == 'failed'
                        }" x-text="camp.status"></span>
                    </div>
                </div>
            </div>
        </template>
    </div>

    <!-- Modal Xem Tasks / Lỗi -->
    <template x-teleport="body">

                </div>

                        <span>📅 Lần chạy hiện tại</span>
                        <span class="px-1.5 py-0.2 bg-black/30 rounded text-[10px]" x-text="filteredTasks().length"></span>
                    </button>
                    <button @click="taskFilter = 'all'" :class="taskFilter === 'all' ? 'bg-rose-600 text-white shadow' : 'bg-slate-800 text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs font-medium transition flex items-center gap-1.5">
                        <span>📚 Tất cả lịch sử</span>
                        <span class="px-1.5 py-0.2 bg-black/30 rounded text-[10px]" x-text="campaignTasks.length"></span>
                    </button>
                </div>

                <!-- Thống kê tiến độ trực quan trong Modal -->
                <div class="mb-4 bg-surface-input border border-slate-700 rounded-lg p-3 space-y-2">
                    <div class="grid grid-cols-4 gap-2 text-center">
                        <div class="bg-slate-800/60 rounded p-2">
                            <span class="text-xs text-slate-400 block">Tổng số</span>
                            <span class="text-lg font-bold text-white" x-text="filteredTasks().length"></span>
                        </div>
                        <div class="bg-emerald-500/10 rounded p-2 border border-emerald-500/20">
                            <span class="text-xs text-emerald-400 block">Thành công</span>
                            <span class="text-lg font-bold text-emerald-400" x-text="filteredTasks().filter(t => t.status === 'success').length"></span>
                        </div>
                        <div class="bg-rose-500/10 rounded p-2 border border-rose-500/20">
                            <span class="text-xs text-rose-400 block">Thất bại</span>
                            <span class="text-lg font-bold text-rose-400" x-text="filteredTasks().filter(t => t.status === 'failed').length"></span>
                        </div>
                        <div class="bg-amber-500/10 rounded p-2 border border-amber-500/20">
                            <span class="text-xs text-amber-400 block">Đang chờ</span>
                            <span class="text-lg font-bold text-amber-400" x-text="filteredTasks().filter(t => t.status !== 'success' && t.status !== 'failed').length"></span>
                        </div>
                    </div>
                    <!-- Thanh tiến trình -->
                    <div class="w-full bg-slate-800 rounded-full h-2 overflow-hidden flex shadow-inner">
                        <div class="bg-emerald-500 h-2 transition-all duration-300" :style="`width: ${(filteredTasks().filter(t => t.status === 'success').length / (filteredTasks().length || 1)) * 100}%`"></div>
                        <div class="bg-rose-500 h-2 transition-all duration-300" :style="`width: ${(filteredTasks().filter(t => t.status === 'failed').length / (filteredTasks().length || 1)) * 100}%`"></div>
                    </div>
                </div>
            
                <div class="space-y-3 overflow-y-auto pr-2">
                    <template x-for="task in filteredTasks()" :key="task.id">
                        <div class="bg-surface-input border border-slate-700 rounded-lg p-3">
                            <div class="flex justify-between items-start mb-2">
                                <a :href="task.target_url" target="_blank" class="text-sm text-blue-400 hover:underline truncate mr-2" x-text="task.target_url"></a>
                                <span class="px-2 py-0.5 rounded text-xs font-medium shrink-0" :class="{
                                    'bg-amber-500/10 text-amber-500': task.status == 'pending',
                                    'bg-emerald-500/10 text-emerald-500': task.status == 'success',
                                    'bg-red-500/10 text-red-500': task.status == 'failed'
                                }" x-text="task.status"></span>
                            </div>
                            <div x-show="task.error_message" class="text-sm text-red-400 bg-red-500/10 p-2 rounded mt-2 border border-red-500/20">
                                <strong>Lỗi:</strong> <span x-text="task.error_message"></span>
                            </div>
                            <div x-show="task.generated_content && task.status == 'success'" class="text-sm text-emerald-400 bg-emerald-500/10 p-2 rounded mt-2 border border-emerald-500/20">
                                <strong>Nội dung:</strong> <span x-text="task.generated_content"></span>
                            </div>
                        </div>
                    </template>
                    <template x-if="filteredTasks().length === 0">
                        <div class="text-slate-400 text-center py-4">Chưa có dữ liệu task trong mục này.</div>
                    </template>
                </div>
            </div>
            </div>
        </div>
    </template>

    <!-- Modal Nhật ký Tool Automation (Live Console) -->
    <template x-teleport="body">
        <div x-show="showLogsModal" class="fixed inset-0 z-50 overflow-y-auto" x-cloak>
            <div class="flex min-h-screen items-center justify-center p-4 text-center">
                <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" @click="showLogsModal = false"></div>
                <div class="relative inline-block w-full max-w-4xl p-6 my-8 text-left align-middle bg-surface-secondary border border-slate-700 rounded-xl shadow-2xl max-h-[90vh] flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-3">
                            <h3 class="text-xl font-heading flex items-center gap-2">
                                <span>📋</span> Nhật ký Tool Automation (Live Console)
                            </h3>
                            <span x-show="logsAutoRefresh" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> Tự cập nhật (3s)
                            </span>
                        </div>
                        <div class="flex items-center gap-2">
                            <button @click="logsAutoRefresh = !logsAutoRefresh" class="px-2.5 py-1 text-xs rounded border transition" :class="logsAutoRefresh ? 'border-emerald-500/40 text-emerald-400 bg-emerald-500/10' : 'border-slate-600 text-slate-400 hover:text-white'">
                                <span x-text="logsAutoRefresh ? '⏸ Tắt tự cuộn' : '▶ Bật tự cuộn'"></span>
                            </button>
                            <button @click="fetchToolLogs()" :disabled="logsLoading" class="px-2.5 py-1 text-xs rounded bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-600 transition flex items-center gap-1">
                                <span :class="{'animate-spin': logsLoading}">🔄</span> Tải lại
                            </button>
                            <button @click="showLogsModal = false" class="text-slate-400 hover:text-white ml-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Console Box -->
                    <div id="tool-logs-container" class="bg-slate-950 border border-slate-800 rounded-lg p-4 font-mono text-xs text-slate-300 h-[60vh] overflow-y-auto space-y-1 select-text">
                        <template x-for="(line, idx) in logs" :key="idx">
                            <div class="whitespace-pre-wrap break-all hover:bg-slate-900/50 py-0.5 px-1 rounded transition font-mono leading-relaxed"
                                 :class="{
                                     'text-rose-400 bg-rose-950/20': line.includes('ERROR') || line.includes('❌') || line.includes('Exception'),
                                     'text-emerald-400': line.includes('SUCCESS') || line.includes('✅') || line.includes('thành công'),
                                     'text-amber-400': line.includes('WARNING') || line.includes('⚠️') || line.includes('Chờ') || line.includes('duyệt'),
                                     'text-cyan-400 font-semibold': line.includes('Task #') || line.includes('Poll #') || line.includes('SEEDING')
                                 }"
                                 x-text="line">
                            </div>
                        </template>
                        <template x-if="logs.length === 0 && !logsLoading">
                            <div class="text-slate-500 text-center py-12 font-mono">Chưa có nhật ký ghi nhận trong file tool_log.txt.</div>
                        </template>
                        <template x-if="logsLoading && logs.length === 0">
                            <div class="text-slate-500 text-center py-12 font-mono">Đang tải nhật ký...</div>
                        </template>
                    </div>

                    <div class="mt-3 flex justify-between items-center text-xs text-slate-400">
                        <span>Đang hiển thị tối đa 100 dòng mới nhất từ <code class="text-slate-300">tool_log.txt</code></span>
                        <span>Nhấn <kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-300">Esc</kbd> hoặc nút X để đóng</span>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <!-- Modal Tạo Chiến Dịch -->
    <template x-teleport="body">
        <div x-show="showModal" class="fixed inset-0 z-50 overflow-y-auto" x-cloak>
            <div class="flex min-h-screen items-center justify-center p-4 text-center">
            <div class="fixed inset-0 bg-black/60 backdrop-blur-sm" @click="showModal = false"></div>
            <div class="relative inline-block w-full max-w-xl p-6 my-8 text-left align-middle bg-surface-secondary border border-slate-700 rounded-xl shadow-2xl max-h-[85vh] overflow-y-auto">

                            <option value="youtube">YouTube</option>
                        </select>
                    </div>
                    <div>

                            <option value="REPLY_COMMENT">↩️ Reply Comment Chéo (Via đối thoại)</option>

                        <template x-for="acc in accounts.filter(a => a.platform === newCampaign.platform)" :key="acc.id">
                            <label :for="'acc_' + acc.id" class="flex items-center gap-2 text-sm text-slate-300 cursor-pointer">

                                <div class="flex items-center gap-1.5 truncate">
                                    <span class="font-medium text-slate-200" x-text="acc.username"></span>
                                    <span x-show="acc.note" class="text-xs text-rose-300/90 bg-rose-500/10 px-1.5 py-0.5 rounded border border-rose-500/20 font-normal" x-text="acc.note"></span>
                                </div>
                                <span class="text-xs px-1.5 py-0.5 rounded-full bg-slate-800 shrink-0" :class="{'text-emerald-400': acc.status=='active', 'text-red-400': acc.status!='active'}" x-text="acc.status"></span>

                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Danh sách Link (Mỗi link 1 dòng)</label>

                <div>
                    <label class="block text-sm text-slate-400 mb-1">Chỉ thị cho AI (System Prompt)</label>
                    <textarea x-model="newCampaign.ai_instructions" class="w-full p-2 bg-surface-input border border-slate-700 rounded-lg focus:border-rose-500 outline-none text-white h-24" placeholder="Dặn dò AI cách xưng hô, kiểu comment..."></textarea>
                </div>
                
                <!-- Nội dung bài đăng (POST_GROUP) -->
                <div x-show="newCampaign.campaign_type === 'POST_GROUP'" x-transition>

                    <textarea x-model="newCampaign.post_content" class="w-full p-2 bg-surface-input border border-slate-700 rounded-lg focus:border-rose-500 outline-none text-white h-28" placeholder="Soạn nội dung bài đăng nhóm tại đây..."></textarea>
                </div>
                
                <!-- Upload Ảnh/Video (POST_GROUP) -->
                <div x-show="newCampaign.campaign_type === 'POST_GROUP'" x-transition>
                    <label class="block text-sm text-slate-400 mb-1">📎 Đính kèm Ảnh / Video</label>
                    <div class="border-2 border-dashed border-slate-600 rounded-lg p-4 text-center hover:border-rose-500 transition cursor-pointer relative">
                        <input type="file" multiple accept="image/*,video/*" @change="uploadMedia($event)" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <svg class="w-8 h-8 mx-auto text-slate-500 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-sm text-slate-400">Kéo thả hoặc click để chọn file</p>
                        <p class="text-xs text-slate-500 mt-1">Hỗ trợ: JPG, PNG, MP4, MOV</p>

                                <img :src="url" class="w-16 h-16 object-cover rounded-lg border border-slate-600">
                                <button @click="removeMedia(idx)" class="absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 rounded-full text-white text-xs flex items-center justify-center opacity-0 group-hover:opacity-100 transition">×</button>
                            </div>
                        </template>
                    </div>
                </div>
                
                <!-- Lịch đăng hàng ngày (POST_GROUP) -->
                <div x-show="newCampaign.campaign_type === 'POST_GROUP'" x-transition>
                    <div class="flex items-center gap-4">
                        <div class="flex-1">
                            <label class="block text-sm text-slate-400 mb-1">⏰ Giờ đăng hàng ngày</label>
                            <input type="time" x-model="newCampaign.daily_schedule_time" class="w-full p-2 bg-surface-input border border-slate-700 rounded-lg focus:border-rose-500 outline-none text-white">
                        </div>
                        <div class="flex items-center gap-2 mt-5">
                            <input type="checkbox" id="daily_repeat" x-model="newCampaign.is_daily_repeat" class="rounded border-slate-700 text-rose-500 focus:ring-rose-500 bg-surface-secondary">
                            <label for="daily_repeat" class="text-sm text-slate-300 cursor-pointer">Tự động lặp lại hàng ngày</label>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 mt-1">Hệ thống sẽ tự tạo task mới mỗi ngày vào giờ đã chọn</p>
                </div>
                
                <!-- Nút sinh kịch bản Reply (REPLY_COMMENT) -->
                <div x-show="newCampaign.campaign_type === 'REPLY_COMMENT' && editingId" x-transition>
                    <button @click="generateReplies(editingId)" class="w-full py-3 bg-gradient-to-r from-purple-600 to-rose-600 hover:from-purple-700 hover:to-rose-700 text-white rounded-lg transition font-medium flex items-center justify-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                        🤖 Sinh kịch bản Reply chéo giữa các Via
                    </button>
                    <p class="text-xs text-slate-500 mt-1">AI sẽ tạo chuỗi hội thoại tự nhiên: Via A comment → Via B reply → Via C bổ sung</p>
                </div>
            </div>
            
            <div class="mt-6 flex flex-wrap items-center justify-between gap-3 border-t border-slate-700/50 pt-4">
                <button @click="showModal = false" class="px-4 py-2 text-slate-400 hover:text-white transition text-sm">Hủy</button>
                <div class="flex items-center gap-2">
                    <button x-show="editingId" @click="saveCampaign(true)" :disabled="isSaving" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white rounded-lg transition font-medium text-sm flex items-center gap-1.5 shadow-lg shadow-amber-900/20" title="Cập nhật nội dung và bắt đầu chạy lại chiến dịch ngay">
                        <span>⚡</span>
                        <span x-text="isSaving ? 'Đang xử lý...' : 'Lưu & Chạy lại ngay'"></span>
                    </button>
                    <button @click="saveCampaign(false)" :disabled="isSaving" class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white rounded-lg transition font-medium text-sm flex items-center gap-1.5 shadow-lg shadow-rose-900/20">
                        <span x-show="editingId">💾</span>
                        <span x-text="isSaving ? 'Đang lưu...' : (editingId ? 'Lưu thay đổi' : 'Tạo Chiến Dịch')"></span>
                    </button>
                </div>
            </div>
            </div>
        </div>
    </template>
</div>
{% endblock %}
