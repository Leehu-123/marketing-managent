{% extends 'base.html' %}
{% block active_nav %}settings{% endblock %}
{% block page_title %}Cài đặt Hệ thống{% endblock %}

{% block content %}
<div x-data="{
    activeTab: 'ai', // 'ai', 'website', 'fanpage', 'imagegen'
    loading: true,
    saving: false,
    testing: null,
    settings: [],
    imageAiSettings: [],
    researchAiSettings: [],
    integrations: [],
    
    brandProfile: { tone_of_voice: '', target_audience: '', core_values: '', product_knowledge: '' },
    
    // Image Gen settings
    logoInfo: { logo_url: null, exists: false },
    productImages: [],
    logoUploading: false,
    productsUploading: false,
    
    async init() {
        await this.loadAllSettings();
        await this.loadImageGenSettings();
    },
    
    async loadAllSettings() {
        this.loading = true;
        try {
            const [resAi, resInt, resBrand] = await Promise.all([
                fetch('/api/v1/settings/ai'),
                fetch('/api/v1/settings/integrations'),
                fetch('/api/v1/brand/')
            ]);
            
            if (!resAi.ok || !resInt.ok || !resBrand.ok) throw new Error('API Error');
            
            const allAi = await resAi.json();
            this.settings = allAi.filter(p => !p.provider_name.includes('(Image)') && !p.provider_name.includes('(Research)'));
            this.imageAiSettings = allAi.filter(p => p.provider_name.includes('(Image)'));
            this.researchAiSettings = allAi.filter(p => p.provider_name.includes('(Research)'));
            
            this.integrations = await resInt.json();
            this.brandProfile = await resBrand.json();
        } catch (err) {
            console.error('Lỗi khi tải cài đặt:', err);
            window.showToast('Không thể tải cấu hình', 'error');
        } finally {
            this.loading = false;
        }
    },
    
    getIntegration(platform) {
        return this.integrations.find(i => i.platform === platform) || {};
    },
    
    async saveSetting(provider) {
        this.saving = true;
        try {
            const res = await fetch(`/api/v1/settings/ai/${provider.provider_name}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    api_key: provider.api_key,
                    base_url: provider.base_url,
                    model_name: provider.model_name,
                    is_active: provider.is_active
                })
            });
            if (!res.ok) throw new Error('API Error');
            
            await this.loadAllSettings();
            window.showToast(`Đã lưu cấu hình cho ${provider.provider_name}`, 'success');
        } catch (err) {
            console.error('Lỗi khi lưu thiết lập:', err);
            window.showToast('Lỗi khi lưu: ' + err.message, 'error');
        } finally {
            this.saving = false;
        }
    },
    
    async saveBrandProfile() {
        this.saving = true;
        try {
            const res = await fetch('/api/v1/brand/', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(this.brandProfile)
            });
            
            if (!res.ok) throw new Error('Cập nhật thất bại');
            this.brandProfile = await res.json();
            window.showToast('Lưu Hồ sơ Thương hiệu thành công!', 'success');
        } catch (err) {
            console.error('Lỗi khi lưu brand profile:', err);
            window.showToast('Lỗi khi lưu: ' + err.message, 'error');
        } finally {
            this.saving = false;
        }
    },
    
    async setActive(selectedProvider) {
        if (selectedProvider.provider_name.includes('(Image)')) {
            this.imageAiSettings.forEach(p => p.is_active = (p.provider_name === selectedProvider.provider_name));
        } else if (selectedProvider.provider_name.includes('(Research)')) {
            this.researchAiSettings.forEach(p => p.is_active = (p.provider_name === selectedProvider.provider_name));
        } else {
            this.settings.forEach(p => p.is_active = (p.provider_name === selectedProvider.provider_name));
        }
        await this.saveSetting(selectedProvider);
    },
    
    async testAIConnection(provider) {
        if (!provider.api_key) {
            window.showToast('Vui lòng nhập API Key trước khi test', 'warning');
            return;
        }
        
        this.testing = provider.provider_name;
        try {
            const res = await fetch('/api/v1/settings/ai/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    provider_name: provider.provider_name,
                    api_key: provider.api_key,
                    base_url: provider.base_url,
                    model_name: provider.model_name
                })
            });
            
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Test failed');
            
            window.showToast(data.message || 'Kết nối thành công!', 'success');
        } catch (err) {
            console.error('Test AI error:', err);
            window.showToast(err.message, 'error');
        } finally {
            this.testing = null;
        }
    },
    
    async saveIntegration(platform) {
        const data = this.getIntegration(platform);
        this.saving = true;
        try {
            const res = await fetch(`/api/v1/settings/integrations/${platform}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    url: data.url,
                    username: data.username,
                    access_token: data.access_token,
                    is_active: data.is_active
                })
            });
            if (!res.ok) throw new Error('API Error');
            
            await this.loadAllSettings();
            window.showToast(`Đã lưu cấu hình cho ${platform}`, 'success');
        } catch (err) {
            console.error('Lỗi khi lưu tích hợp:', err);
            window.showToast(`Lỗi khi lưu cấu hình ${platform}`, 'error');
        } finally {
            this.saving = false;
        }
    },
    
    async connectGoogleAuth() {
        const data = this.getIntegration('GoogleAnalytics');
        if (!data.url || !data.username || !data.access_token) {
            window.showToast('Vui lòng điền đủ Property ID, Client ID và Client Secret', 'error');
            return;
        }
        this.saving = true;
        try {
            const res = await fetch('/api/v1/settings/integrations/google/auth', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    property_id: data.url,
                    client_id: data.username,
                    client_secret: data.access_token
                })
            });
            const result = await res.json();
            if (res.ok && result.auth_url) {
                window.location.href = result.auth_url; // Redirect to Google OAuth
            } else {
                throw new Error(result.detail || 'Lỗi sinh auth URL');
            }
        } catch (err) {
            console.error('Lỗi khi connect Google:', err);
            window.showToast('Có lỗi xảy ra: ' + err.message, 'error');
            this.saving = false;
        }
    },
    
    // === IMAGE GEN SETTINGS ===
    async loadImageGenSettings() {
        try {
            const [logoRes, prodRes] = await Promise.all([
                fetch('/api/v1/image-gen/logo'),
                fetch('/api/v1/image-gen/products-folders')
            ]);
            if (logoRes.ok) this.logoInfo = await logoRes.json();
            if (prodRes.ok) {
                const data = await prodRes.json();
                this.productImages = data.folders || [];
            }
        } catch (err) {
            console.error('Load image gen settings error:', err);
        }
    },
    
    async uploadLogo(event) {
        const file = event.target.files[0];
        if (!file) return;
        this.logoUploading = true;
        const formData = new FormData();
        formData.append('file', file);
        try {
            const res = await fetch('/api/v1/image-gen/logo', { method: 'POST', body: formData });
            if (!res.ok) throw new Error('Upload failed');
            const data = await res.json();
            this.logoInfo = { logo_url: data.logo_url, exists: true };
            window.showToast('Logo đã được cập nhật!', 'success');
        } catch (err) {
            window.showToast('Không thể upload logo', 'error');
        } finally {
            this.logoUploading = false;
            event.target.value = '';
        }
    },
    
    async uploadProducts(event) {
        const files = event.target.files;
        if (!files || files.length === 0) return;
        this.productsUploading = true;
        const formData = new FormData();
        for (let i = 0; i < files.length; i++) formData.append('files', files[i]);
        try {
            const res = await fetch('/api/v1/image-gen/products', { method: 'POST', body: formData });
            if (!res.ok) throw new Error('Upload failed');
            await this.loadImageGenSettings();
            window.showToast('Đã thêm ảnh sản phẩm!', 'success');
        } catch (err) {
            window.showToast('Không thể upload ảnh sản phẩm', 'error');
        } finally {
            this.productsUploading = false;
            event.target.value = '';
        }
    },
    
    async deleteProduct(filename) {
        if (!confirm('Xóa ảnh sản phẩm này?')) return;
        try {
            const res = await fetch(`/api/v1/image-gen/products/${filename}`, { method: 'DELETE' });
            if (!res.ok) throw new Error('Delete failed');
            this.productImages = this.productImages.filter(p => p.filename !== filename);
            window.showToast('Đã xóa ảnh sản phẩm', 'success');
        } catch (err) {
            window.showToast('Không thể xóa', 'error');
        }
    }

                    </div>
                    <label class="flex items-center cursor-pointer">
                        <div class="relative">
                            <input type="checkbox" class="sr-only" x-model="getIntegration('Fanpage').is_active">
                            <div class="block bg-slate-700 w-14 h-8 rounded-full transition-colors" :class="getIntegration('Fanpage').is_active ? 'bg-indigo-500' : 'bg-slate-700'"></div>
                            <div class="dot absolute left-1 top-1 bg-white w-6 h-6 rounded-full transition-transform" :class="getIntegration('Fanpage').is_active ? 'transform translate-x-6' : ''"></div>
                        </div>
                        <div class="ml-3 text-sm font-medium" :class="getIntegration('Fanpage').is_active ? 'text-indigo-400' : 'text-slate-400'">Kích hoạt tính năng</div>
                    </label>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Page ID</label>
                        <input type="text" class="form-input w-full" placeholder="1023456789" x-model="getIntegration('Fanpage').username">
                        <p class="text-xs text-slate-500 mt-1">ID của Fanpage (có thể xem trong phần Giới thiệu của Fanpage).</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">Page Access Token</label>
                        <input type="password" class="form-input w-full" placeholder="EAABxxxx..." x-model="getIntegration('Fanpage').access_token">
                        <p class="text-xs text-slate-500 mt-1">Token quyền quản trị được tạo từ Meta Developer App (Yêu cầu quyền: pages_manage_posts, pages_read_engagement).</p>
                    </div>
                    <div class="pt-4 border-t border-white/5 flex justify-end">
                        <button class="btn btn-primary" style="background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);" @click="saveIntegration('Fanpage')" :disabled="saving">
                            Lưu Cấu Hình Fanpage
                        </button>
                    </div>
                </div>
            </div>

            <!-- TAB: IMAGE GEN -->
            <div x-show="activeTab === 'imagegen'" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="glass-card p-6">
                <div class="mb-6 border-b border-white/10 pb-6">
                    <h2 class="text-xl font-heading font-semibold text-white mb-2">API Trí tuệ nhân tạo (Tạo Ảnh)</h2>
                    <p class="text-sm text-slate-400 mb-4">Cấu hình API Key riêng cho tính năng AI sinh ảnh.</p>
                    
                    <template x-for="provider in imageAiSettings" :key="provider.provider_name">
                        <div class="p-5 rounded-xl border transition-all duration-300" :class="provider.is_active ? 'bg-pink-500/10 border-pink-500/30' : 'bg-white/[0.02] border-white/[0.05]'">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                                <div class="flex items-center gap-4">
                                    <div class="w-12 h-12 rounded-lg flex items-center justify-center font-bold text-xl bg-pink-500/20 text-pink-400">
                                        <span x-text="provider.provider_name.charAt(0)"></span>
                                    </div>
                                    <div>
                                        <h3 class="text-lg font-semibold text-white" x-text="provider.provider_name"></h3>
                                        <div class="flex items-center mt-1 cursor-pointer" @click="setActive(provider)">
                                            <div class="w-8 h-4 rounded-full relative transition-colors duration-200" :class="provider.is_active ? 'bg-pink-500' : 'bg-slate-700'">
                                                <div class="w-3 h-3 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform duration-200" :class="provider.is_active ? 'transform translate-x-4' : ''"></div>
                                            </div>
                                            <span class="text-xs ml-2 font-medium" :class="provider.is_active ? 'text-pink-400' : 'text-slate-400'" x-text="provider.is_active ? 'Đang kích hoạt' : 'Bật để sử dụng'"></span>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex-1 md:max-w-md flex flex-col gap-3">
                                    <div>
                                        <label class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 block ml-1">Base URL (Tùy chọn)</label>
                                        <input type="text" class="form-input w-full text-xs py-1.5" placeholder="VD: https://api.9router.com/v1" x-model="provider.base_url" :disabled="provider.provider_name.includes('Gemini')">
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 block ml-1">Tên Model (Model Name)</label>
                                        <input type="text" class="form-input w-full text-xs py-1.5" placeholder="VD: dall-e-3, imagen-3.0-generate-002,..." x-model="provider.model_name">
                                    </div>
                                    <div>
                                        <label class="text-[10px] text-slate-500 uppercase tracking-wider mb-1 block ml-1">API Key</label>
                                        <div class="flex gap-2">
                                            <input type="password" class="form-input flex-1 text-xs py-1.5" placeholder="AIzaSy..." x-model="provider.api_key">
                                            <button class="btn btn-secondary px-3 py-1.5 text-xs" @click="saveSetting(provider)" :disabled="saving">Lưu</button>
                                            <button class="btn btn-primary px-3 py-1.5 text-xs" @click="testAIConnection(provider)" :disabled="testing === provider.provider_name">
                                                <span x-show="testing !== provider.provider_name">Test</span>
                                                <span x-show="testing === provider.provider_name" class="opacity-50">...</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
            <!-- TAB: GA4 OAUTH -->
            <div x-show="activeTab === 'ga4'" x-cloak x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 translate-y-2" x-transition:enter-end="opacity-100 translate-y-0" class="glass-card p-6">
                <div class="flex items-center justify-between mb-6">
                    <div>
                        <h2 class="text-xl font-heading font-semibold text-white mb-1">Kết nối Google Analytics 4</h2>
                        <p class="text-sm text-slate-400">Đăng nhập tài khoản Google để kéo dữ liệu vào bảng điều khiển (OAuth 2.0).</p>
                    </div>
                    <div class="px-3 py-1 rounded-full text-xs font-semibold"
                         :class="getIntegration('GoogleAnalytics').is_active ? 'bg-green-500/20 text-green-400' : 'bg-slate-700/50 text-slate-400'">
                        <span x-text="getIntegration('GoogleAnalytics').is_active ? 'Đã Kết Nối' : 'Chưa Kết Nối'"></span>
                    </div>
                </div>

                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">GA4 Property ID</label>
                        <input type="text" class="form-input w-full" placeholder="123456789" x-model="getIntegration('GoogleAnalytics').url">
                        <p class="text-xs text-slate-500 mt-1">Mã Thuộc Tính (Property ID) của Google Analytics 4.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">OAuth Client ID</label>
                        <input type="text" class="form-input w-full" placeholder="xxxxxx-yyyyyy.apps.googleusercontent.com" x-model="getIntegration('GoogleAnalytics').username">
                        <p class="text-xs text-slate-500 mt-1">Tạo tại Google Cloud Console > APIs & Services > Credentials > OAuth 2.0 Client IDs.</p>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-1">OAuth Client Secret</label>
                        <input type="password" class="form-input w-full" placeholder="GOCSPX-xxxxxx..." x-model="getIntegration('GoogleAnalytics').access_token">
                    </div>
                    <div class="pt-4 border-t border-white/5 flex justify-end">
                        <button class="btn btn-primary bg-amber-500 hover:bg-amber-600 text-white border-amber-500 hover:border-amber-600" @click="connectGoogleAuth()" :disabled="saving">
                            <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 24 24"><path d="M12.24 10.285V14.4h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.345-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0c-6.635 0-12 5.365-12 12s5.365 12 12 12c6.926 0 11.52-4.869 11.52-11.726 0-.788-.085-1.39-.189-1.989H12.24z"/></svg>
                            Lưu & Đăng Nhập với Google
                        </button>
                    </div>
                </div>
            </div>
            
        </div>
    </template>
</div>
{% endblock %}
