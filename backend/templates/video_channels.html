{% extends "base.html" %}

{% block content %}
<div x-data="videoChannelsData()" class="p-6 space-y-6 pb-32">
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center space-y-4 sm:space-y-0">
        <div>
            <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500">Quản Lý Kênh Video</h1>
            <p class="text-gray-400 mt-2 text-sm">Quản lý và theo dõi hiệu suất các kênh truyền thông đa nền tảng</p>
        </div>
        <button @click="openModal()" class="px-5 py-2.5 bg-gradient-to-r from-blue-600 to-purple-600 text-white font-medium rounded-xl shadow-lg shadow-blue-500/20 hover:shadow-xl hover:shadow-blue-500/40 hover:from-blue-500 hover:to-purple-500 transition-all duration-300 transform hover:-translate-y-0.5 flex items-center space-x-2">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <span>Thêm Kênh Mới</span>
        </button>
    </div>

    <!-- Tabs -->
    <div class="flex space-x-2 border-b border-white/10 pb-px">
        <template x-for="tab in tabs" :key="tab.id">
            <button @click="activeTab = tab.id" 
                    :class="activeTab === tab.id ? 'bg-white/10 text-white border-b-2 border-blue-500' : 'text-gray-400 hover:text-white hover:bg-white/5'"
                    class="px-6 py-3 rounded-t-xl font-semibold transition-all duration-300" x-text="tab.name"></button>
        </template>
    </div>

    <!-- Channels Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        <template x-for="channel in filteredChannels" :key="channel.id">
            <div class="bg-gray-900/40 backdrop-blur-xl border border-white/10 rounded-3xl p-6 hover:border-white/20 transition-all duration-500 shadow-[0_8px_30px_rgb(0,0,0,0.12)] relative overflow-hidden group flex flex-col h-full">
                <!-- Background Glow Effect -->
                <div class="absolute -inset-2 bg-gradient-to-br from-blue-500/10 to-purple-500/10 opacity-0 group-hover:opacity-100 transition-opacity duration-500 blur-xl -z-10"></div>
                
                <div class="flex justify-between items-start mb-6 z-10">
                    <div class="flex items-center space-x-4">
                        <div class="relative">
                            <img :src="channel.avatar || 'https://ui-avatars.com/api/?name='+channel.name+'&background=random'" class="w-16 h-16 rounded-full border-2 border-white/20 object-cover shadow-lg transform group-hover:scale-105 transition-transform duration-300">
                            <div class="absolute -bottom-1 -right-1 w-5 h-5 bg-gray-900 rounded-full flex items-center justify-center">
                                <span class="w-3 h-3 rounded-full" :class="channel.status === 'Active' ? 'bg-green-500 shadow-[0_0_8px_rgba(34,197,94,0.8)]' : 'bg-red-500 shadow-[0_0_8px_rgba(239,68,68,0.8)]'"></span>
                            </div>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-white leading-tight" x-text="channel.name"></h3>
                            <p class="text-xs text-gray-400 mt-1 bg-white/5 inline-block px-2 py-0.5 rounded-md" x-text="channel.channel_type"></p>
                        </div>
                    </div>
                </div>
                
                <div class="space-y-4 text-sm text-gray-300 mb-6 flex-1 z-10">
                    <div class="bg-black/20 p-3 rounded-xl border border-white/5">
                        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Mục tiêu & Định hướng</p>
                        <p class="font-medium text-blue-100/80" x-text="channel.goal"></p>
                    </div>
                    <div class="bg-black/20 p-3 rounded-xl border border-white/5">
                        <p class="text-xs text-gray-500 uppercase tracking-wider font-semibold mb-1">Vibe Kênh</p>
                        <p class="font-medium text-purple-100/80" x-text="channel.vibe"></p>
                    </div>
                </div>

                <div class="flex space-x-3 mt-auto z-10">
                    <button @click="editChannel(channel)" class="flex-1 py-2.5 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-white text-sm font-semibold transition-all duration-300 flex justify-center items-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                        <span>Sửa</span>
                    </button>
                    <button class="flex-1 py-2.5 bg-blue-600/10 hover:bg-blue-600/20 border border-blue-500/20 rounded-xl text-blue-400 text-sm font-semibold transition-all duration-300 flex justify-center items-center space-x-2 group-hover:border-blue-500/40">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                        <span>Token</span>
                    </button>
                </div>
            </div>
        </template>

        <!-- Empty State -->
        <template x-if="filteredChannels.length === 0">
            <div class="col-span-full py-12 flex flex-col items-center justify-center bg-gray-900/20 rounded-3xl border border-white/5 border-dashed">
                <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mb-4">
                    <svg class="w-8 h-8 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                </div>
                <p class="text-gray-400 text-lg">Chưa có kênh nào trong nền tảng này.</p>
                <button @click="openModal()" class="mt-4 text-blue-400 hover:text-blue-300 font-medium">Thêm kênh đầu tiên ngay</button>
            </div>
        </template>
    </div>

    <!-- Modal Form -->
    <div x-show="isModalOpen" style="display: none;" class="fixed inset-0 z-50 overflow-y-auto" aria-labelledby="modal-title" role="dialog" aria-modal="true">
        <div class="flex items-center justify-center min-h-screen p-4 text-center sm:p-0">
            <div x-show="isModalOpen" x-transition.opacity @click="closeModal()" class="fixed inset-0 bg-black/70 backdrop-blur-md transition-opacity" aria-hidden="true"></div>
            
            <div x-show="isModalOpen" 
                 x-transition:enter="ease-out duration-300" 
                 x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                 x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100" 
                 x-transition:leave="ease-in duration-200" 
                 x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100" 
                 x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95" 
                 class="relative inline-block align-bottom bg-gray-900 border border-white/10 rounded-3xl text-left overflow-hidden shadow-[0_0_50px_rgba(0,0,0,0.5)] transform transition-all sm:my-8 sm:align-middle w-full max-w-xl">
                
                <div class="absolute top-0 inset-x-0 h-1 bg-gradient-to-r from-blue-500 to-purple-500"></div>

                <div class="px-6 py-8 sm:px-10">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-bold text-white" id="modal-title" x-text="modalMode === 'add' ? 'Thêm Kênh Mới' : 'Cập Nhật Kênh'"></h3>
                        <button @click="closeModal()" class="p-2 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 rounded-full transition-colors"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg></button>
                    </div>
                    
                    <form @submit.prevent="saveChannel" class="space-y-6">
                        <div>
                            <label class="block text-sm font-semibold text-gray-300 mb-2">Tên kênh</label>
                            <input x-model="form.name" type="text" required class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all shadow-inner">
                        </div>
                        
                        <div class="grid grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-semibold text-gray-300 mb-2">Nền tảng</label>
                                <div class="relative">
                                    <select x-model="form.platform" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all appearance-none shadow-inner">
                                        <option value="tiktok">TikTok</option>
                                        <option value="youtube">YouTube Shorts</option>
                                        <option value="facebook">Facebook Reels</option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-300 mb-2">Loại kênh</label>
                                <div class="relative">
                                    <select x-model="form.channel_type" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all appearance-none shadow-inner">
                                        <option value="Thương hiệu">Thương hiệu</option>
                                        <option value="KOL chính">KOL chính</option>
                                        <option value="KOL phụ">KOL phụ</option>
                                    </select>
                                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-gray-400">
                                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-300 mb-2">Mục tiêu & Định hướng</label>
                            <textarea x-model="form.goal" rows="2" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all shadow-inner"></textarea>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-semibold text-gray-300 mb-2">Vibe của kênh</label>
                            <input x-model="form.vibe" type="text" placeholder="VD: Hài hước, Năng động, Chuyên gia..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all shadow-inner placeholder-gray-600">
                        <div>
                            <label class="block text-sm font-semibold text-gray-300 mb-2">Đối tượng người xem</label>
                            <input x-model="form.target_audience" type="text" placeholder="VD: Giới trẻ 18-25, Mẹ bỉm sữa, Dân văn phòng..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all shadow-inner placeholder-gray-600">
                        </div>

                        <div class="grid grid-cols-2 gap-5">
                            <div>
                                <label class="block text-sm font-semibold text-gray-300 mb-2">Độ dài & Định dạng</label>
                                <input x-model="form.format_length" type="text" placeholder="VD: 30-60s, Video dọc, Đóng vai..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all shadow-inner placeholder-gray-600">
                            </div>
                            <div>
                                <label class="block text-sm font-semibold text-gray-300 mb-2">Giọng điệu (Tone of voice)</label>
                                <input x-model="form.tone_of_voice" type="text" placeholder="VD: Thân thiện, Chuyên gia, Hài hước..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all shadow-inner placeholder-gray-600">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-300 mb-2">Thông điệp chính</label>
                            <textarea x-model="form.key_message" rows="2" placeholder="VD: DAFA Glass mang lại sự an toàn và sang trọng..." class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all shadow-inner placeholder-gray-600"></textarea>
                        </div>

                        <div class="pt-6 border-t border-white/10">
                            <h4 class="text-sm font-bold text-white mb-4 uppercase tracking-wider flex items-center"><svg class="w-4 h-4 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg> API Credentials</h4>
                            <div class="space-y-4">
                                <div>
                                    <label class="block text-xs font-medium text-gray-400 mb-1">Access Token</label>
                                    <input x-model="form.accessToken" type="password" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all font-mono text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-gray-400 mb-1">Refresh Token</label>
                                    <input x-model="form.refreshToken" type="password" class="w-full bg-black/40 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:ring-2 focus:ring-purple-500 focus:border-transparent outline-none transition-all font-mono text-sm">
                                </div>
                            </div>
                        </div>

                        <div class="pt-4 flex justify-end space-x-3">
                            <button type="button" @click="closeModal()" class="px-6 py-3 bg-white/5 hover:bg-white/10 border border-white/10 rounded-xl text-white font-medium transition-all duration-300">Hủy</button>
                            <button type="submit" class="px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 text-white font-bold rounded-xl shadow-lg shadow-blue-500/25 transition-all duration-300">Lưu Thông Tin</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function videoChannelsData() {
    return {
        tabs: [
            {id: 'tiktok', name: 'TikTok'},
            {id: 'youtube', name: 'YouTube Shorts'},
            {id: 'facebook', name: 'Facebook Reels'}
        ],
        activeTab: 'tiktok',
        channels: [],
        isModalOpen: false,
        modalMode: 'add',
        form: { name: '', platform: 'tiktok', channel_type: 'Thương hiệu', goal: '', vibe: '', target_audience: '', format_length: '', tone_of_voice: '', key_message: '', accessToken: '', refreshToken: '' },
        get filteredChannels() {
            return this.channels.filter(c => c.platform === this.activeTab);
        },
        async init() {
            await this.loadChannels();
        },
        async loadChannels() {
            try {
                const res = await fetch('/api/v1/video-channels/');
                if (res.ok) {
                    this.channels = await res.json();
                } else {
                    window.showToast?.('Lỗi tải danh sách kênh', 'error') || alert('Lỗi tải danh sách kênh');
                }
            } catch (err) {
                console.error(err);
                window.showToast?.('Lỗi tải danh sách kênh', 'error') || alert('Lỗi tải danh sách kênh');
            }
        },
        openModal() {
            this.modalMode = 'add';
            this.form = { name: '', platform: this.activeTab, channel_type: 'Thương hiệu', goal: '', vibe: '', target_audience: '', format_length: '', tone_of_voice: '', key_message: '', accessToken: '', refreshToken: '' };
            this.isModalOpen = true;
        },
        closeModal() {
            this.isModalOpen = false;
        },
        editChannel(channel) {
            this.modalMode = 'edit';
            this.form = { ...channel, accessToken: '', refreshToken: '' };
            this.isModalOpen = true;
        },
        async saveChannel() {
            if(this.modalMode === 'add') {
                try {
                    const payload = {
                        name: this.form.name,
                        channel_type: this.form.channel_type,
                        platform: this.form.platform,
                        goal: this.form.goal,
                        vibe: this.form.vibe,
                        target_audience: this.form.target_audience,
                        format_length: this.form.format_length,
                        tone_of_voice: this.form.tone_of_voice,
                        key_message: this.form.key_message,
                        access_token: this.form.accessToken,
                        refresh_token: this.form.refreshToken
                    };
                    const res = await fetch('/api/v1/video-channels/', {
                        method: 'POST',
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        window.showToast?.('Thêm kênh thành công', 'success') || alert('Thêm kênh thành công');
                        await this.loadChannels();
                        this.closeModal();
                    } else {
                        window.showToast?.('Lỗi thêm kênh', 'error') || alert('Lỗi thêm kênh');
                    }
                } catch (err) {
                    console.error(err);
                    window.showToast?.('Lỗi thêm kênh', 'error') || alert('Lỗi thêm kênh');
                }
            } else {
                try {
                    const payload = {
                        name: this.form.name,
                        channel_type: this.form.channel_type,
                        platform: this.form.platform,
                        goal: this.form.goal,
                        vibe: this.form.vibe,
                        target_audience: this.form.target_audience,
                        format_length: this.form.format_length,
                        tone_of_voice: this.form.tone_of_voice,
                        key_message: this.form.key_message
                    };
                    const res = await fetch('/api/v1/video-channels/' + this.form.id, {
                        method: 'PUT',
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    if (res.ok) {
                        window.showToast?.('Cập nhật thành công', 'success') || alert('Cập nhật thành công');
                        await this.loadChannels();
                        this.closeModal();
                    }
                } catch(e) {}
            }
        }
    }
}
</script>
{% endblock %}
