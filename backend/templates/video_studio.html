{% extends "base.html" %}

{% block content %}
<div x-data="videoStudioData()" class="p-4 sm:p-6 pb-32 min-h-screen flex flex-col bg-[#050505]">
    <!-- Header -->
    <div class="mb-6 flex justify-between items-end shrink-0">
        <div>
            <h1 class="text-3xl font-black bg-clip-text text-transparent bg-gradient-to-r from-orange-500 to-rose-600">Video Studio</h1>
            <p class="text-gray-400 mt-1 text-sm font-medium">Chỉnh sửa, tạo Caption bằng AI & Đăng tải tự động</p>
        </div>
    </div>

    <!-- Layout 2 cột -->
    <div class="flex-1 flex flex-col xl:flex-row gap-6">
        
        <!-- Cột Trái: Danh sách video -->
        <div class="w-full xl:w-80 bg-gray-900/50 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-xl flex flex-col overflow-hidden shrink-0">
            <div class="px-5 py-4 border-b border-white/10 flex justify-between items-center bg-black/20">
                <span class="font-bold text-white text-sm uppercase tracking-wider">Video Chờ Xử Lý</span>
                <span class="bg-orange-500/20 text-orange-400 border border-orange-500/30 px-2 py-0.5 rounded-md text-xs font-bold" x-text="filteredVideos.length"></span>
            </div>

            <!-- Filters -->
            <div class="px-4 py-3 bg-black/40 border-b border-white/5 grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Trạng thái</label>
                    <select x-model="filterStatus" class="w-full bg-black/50 border border-white/10 rounded-lg px-2 py-1.5 text-xs text-white outline-none focus:ring-1 focus:ring-orange-500 appearance-none">
                        <option value="Tất cả">Tất cả</option>
                        <option value="InProduction">Đang sản xuất</option>
                        <option value="ReadyToPublish">Sẵn sàng xuất bản</option>
                        <option value="Scheduled">Đã lên lịch</option>
                        <option value="Published">Đã xuất bản</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-400 mb-1 uppercase">Thời gian</label>
                    <select x-model="filterTime" class="w-full bg-black/50 border border-white/10 rounded-lg px-2 py-1.5 text-xs text-white outline-none focus:ring-1 focus:ring-indigo-500 appearance-none">
                        <option value="Tất cả">Tất cả</option>
                        <option value="Hôm nay">Hôm nay</option>
                        <option value="Tuần này">Tuần này</option>
                        <option value="Tháng này">Tháng này</option>
                        <option value="30 ngày qua">30 ngày qua</option>
                    </select>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto p-3 space-y-2 custom-scrollbar">
                <template x-for="video in filteredVideos" :key="video.id">
                    <div @click="selectVideo(video)" 
                         :class="selectedVideo && selectedVideo.id === video.id ? 'bg-orange-500/10 border-orange-500/50 shadow-[0_0_15px_rgba(249,115,22,0.15)]' : 'bg-black/40 border-white/5 hover:border-white/20 hover:bg-white/5'"
                         class="border rounded-2xl p-3 cursor-pointer transition-all duration-300 flex space-x-3 group">
                        <div class="w-16 h-24 bg-gray-800 rounded-xl flex-shrink-0 relative overflow-hidden border border-white/10">
                            <img :src="video.thumbnail" class="w-full h-full object-cover opacity-60 group-hover:opacity-100 transition-opacity">
                            <div class="absolute inset-0 flex items-center justify-center">
                                <div class="w-6 h-6 rounded-full bg-black/50 backdrop-blur flex items-center justify-center">
                                    <svg class="w-3 h-3 text-white ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M4 4l12 6-12 6z"></path></svg>
                                </div>
                            </div>
                        </div>
                        <div class="flex-1 min-w-0 py-1">
                            <h4 class="text-sm font-bold text-white truncate" x-text="video.title"></h4>
                            <p class="text-[11px] text-gray-400 mt-1 truncate" x-text="video.campaign"></p>
                            <div class="mt-3 flex items-center space-x-2">
                                <span class="text-[10px] font-mono px-1.5 py-0.5 rounded bg-white/10 text-gray-300 border border-white/5" x-text="video.duration"></span>
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded border"
                                      :class="{
                                          'text-yellow-400 bg-yellow-500/10 border-yellow-500/20': video.status === 'Chờ duyệt',
                                          'text-green-400 bg-green-500/10 border-green-500/20': video.status === 'Đã duyệt',
                                          'text-blue-400 bg-blue-500/10 border-blue-500/20': video.status === 'Đã lên lịch'
                                      }"
                                      x-text="video.status"></span>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Cột Phải: Trình chỉnh sửa & Xem trước -->
        <div class="flex-1 bg-gray-900/50 backdrop-blur-2xl border border-white/10 rounded-3xl shadow-xl flex flex-col lg:flex-row overflow-hidden relative">
            
            <!-- Empty State Overlay -->
            <template x-if="!selectedVideo">
                <div class="absolute inset-0 flex flex-col items-center justify-center bg-black/60 z-20 backdrop-blur-md">
                    <div class="w-20 h-20 bg-white/5 rounded-full flex items-center justify-center mb-4 border border-white/10">
                        <svg class="w-10 h-10 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 10l4.553-2.276A1 1 0 0121 8.618v6.764a1 1 0 01-1.447.894L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    </div>
                    <p class="text-white font-bold text-xl">Chọn một video để bắt đầu</p>
                    <p class="text-gray-400 text-sm mt-2">Cấu hình caption, thumbnail và lên lịch đăng tải</p>
                </div>
            </template>

            <!-- Editor Form -->
            <div class="flex-1 p-6 lg:p-8 border-b lg:border-b-0 lg:border-r border-white/10 overflow-y-auto custom-scrollbar">
                <div class="max-w-2xl mx-auto space-y-8">
                    
                    <!-- Channel Select -->
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Kênh Đăng Tải</label>
                        <div class="relative">
                            <select x-model="publishChannel" class="w-full bg-black/50 border border-white/10 rounded-2xl px-5 py-4 text-white focus:ring-2 focus:ring-orange-500 outline-none appearance-none font-bold text-lg shadow-inner">
                                <template x-for="c in allChannels" :key="c.id">
                                    <option :value="c.id" class="bg-gray-900" x-text="c.name"></option>
                                </template>
                            </select>
                            <div class="absolute inset-y-0 right-4 flex items-center pointer-events-none text-orange-500">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                            </div>
                        </div>
                    </div>

                    <!-- Media Info -->
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">File Video</label>
                        <div class="flex items-center space-x-4 bg-black/30 border border-white/5 rounded-2xl p-4">
                            <div class="w-12 h-12 bg-orange-500/20 rounded-xl flex items-center justify-center text-orange-500">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 4v16M17 4v16M3 8h4m10 0h4M3 12h18M3 16h4m10 0h4M4 20h16a1 1 0 001-1V5a1 1 0 00-1-1H4a1 1 0 00-1 1v14a1 1 0 001 1z"></path></svg>
                            </div>
                            <div class="flex-1">
                                <p class="text-white font-bold text-sm" x-text="selectedVideo ? selectedVideo.fileName : '---'"></p>
                                <p class="text-gray-500 text-xs font-mono mt-0.5" x-text="selectedVideo && selectedVideo.fileName !== 'Chưa tải lên' ? 'MP4 / H264' : ''"></p>
                            </div>
                            <input type="file" id="video-upload" class="hidden" accept="video/*" @change="handleVideoUpload($event)">
                            <label for="video-upload" class="cursor-pointer px-4 py-2 bg-white/5 hover:bg-white/10 rounded-lg text-xs font-bold text-white transition-colors border border-white/10">Tải lên</label>
                        </div>
                    </div>

                    <!-- Caption & AI -->
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest">Caption & Hashtag</label>
                            <button @click="generateAI()" class="px-4 py-2 bg-gradient-to-r from-violet-600 to-fuchsia-600 hover:from-violet-500 hover:to-fuchsia-500 text-white text-xs font-bold rounded-xl flex items-center space-x-2 shadow-lg transition-all transform hover:scale-105">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                <span>AI Viết Caption Theo Vibe Kênh</span>
                            </button>
                        </div>
                        <div class="relative">
                            <textarea x-model="caption" rows="5" class="w-full bg-black/50 border border-white/10 rounded-2xl p-5 text-white focus:ring-2 focus:ring-orange-500 outline-none transition-all placeholder-gray-600 text-sm leading-relaxed" placeholder="Nhập nội dung mô tả..."></textarea>
                            <div class="absolute bottom-4 right-4 text-xs text-gray-500 font-mono" x-text="caption.length + ' / 2200'"></div>
                        </div>
                    </div>

                    <!-- Thumbnail -->
                    <div>
                        <label class="block text-xs font-bold text-gray-400 mb-3 uppercase tracking-widest">Ảnh Bìa (Thumbnail)</label>
                        <!-- Thumbnail Image Preview -->
                        <div class="mb-4 aspect-[9/16] w-64 mx-auto rounded-xl border border-white/10 bg-black/40 overflow-hidden relative group">
                            <template x-if="selectedVideo.thumbnail">
                                <img :src="selectedVideo.thumbnail" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                            </template>
                            <template x-if="!selectedVideo.thumbnail">
                                <div class="absolute inset-0 flex items-center justify-center text-gray-600 font-medium text-sm">Chưa có ảnh bìa</div>
                            </template>
                        </div>
                        
                        <!-- Thumbnail Image Prompt -->
                        <div class="mb-4 bg-black/30 border border-white/10 rounded-xl p-3 space-y-3">
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-1">Chữ in trên ảnh bìa (Headline/Title)</label>
                                <input type="text" class="w-full bg-black/50 border border-white/10 rounded-lg px-3 py-1.5 text-sm text-gray-300 outline-none focus:border-indigo-500" placeholder="Nhập tiêu đề muốn in đè lên ảnh..." x-model="selectedVideo.headline">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-400 mb-1">Prompt Tạo Ảnh AI</label>
                                <textarea class="w-full bg-black/50 border border-white/10 rounded-lg px-3 py-2 text-sm text-gray-300 resize-none outline-none focus:border-indigo-500" rows="2" placeholder="Gợi ý ngữ cảnh, màu sắc (VD: Studio lighting, viền neon)..." x-model="selectedVideo.image_prompt"></textarea>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-2 gap-4 relative">
                            <input type="file" id="thumbnail-upload" class="hidden" accept="image/*" @change="handleFileUpload($event)">
                            <label for="thumbnail-upload" class="cursor-pointer py-4 bg-black/40 border border-white/10 border-dashed rounded-2xl text-sm font-bold text-gray-400 hover:text-white hover:border-white/30 transition-all flex flex-col items-center justify-center space-y-2 group">
                                <svg class="w-6 h-6 text-gray-500 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                                <span>Tải Ảnh Lên</span>
                            </label>
                            
                            <template x-if="!selectedVideo?.thumbnail">
                                <button @click="generateThumbnailAI()" class="flex-1 py-4 bg-indigo-500/10 border border-indigo-500/30 rounded-2xl text-sm font-bold text-indigo-300 hover:bg-indigo-500/20 transition-all flex flex-col items-center justify-center space-y-2 group relative overflow-hidden">
                                    <div class="absolute inset-0 bg-gradient-to-r from-indigo-500/0 via-indigo-500/10 to-indigo-500/0 translate-x-[-100%] group-hover:translate-x-[100%] transition-transform duration-1000"></div>
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"></path></svg>
                                    <span>AI Tạo Ảnh Bìa</span>
                                </button>
                            </template>
                            <template x-if="selectedVideo?.thumbnail">
                                <button @click="deleteThumbnail()" class="flex-1 py-4 bg-red-500/10 border border-red-500/30 rounded-2xl text-sm font-bold text-red-400 hover:bg-red-500/20 transition-all flex flex-col items-center justify-center space-y-2 group relative overflow-hidden">
                                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                    <span>Xóa Ảnh Bìa</span>
                                </button>
                            </template>
                        </div>
                    </div>

                </div>
            </div>

            <!-- Preview & Actions Pane -->
            <div class="w-full lg:w-[400px] p-6 lg:p-8 bg-black/40 flex flex-col items-center justify-between shrink-0 border-l border-white/5 relative z-10">
                
                <div class="w-full flex justify-center mb-6">
                    <span class="px-4 py-1.5 bg-white/10 rounded-full text-xs font-bold text-gray-300 uppercase tracking-widest border border-white/5">Preview Mobile</span>
                </div>
                
                <!-- Phone Mockup -->
                <div class="w-[280px] h-[580px] bg-black border-[12px] border-gray-900 rounded-[3rem] relative shadow-2xl overflow-hidden flex flex-col shrink-0">
                    <!-- Notch -->
                    <div class="absolute top-0 inset-x-0 h-7 flex justify-center z-30">
                        <div class="w-36 h-7 bg-gray-900 rounded-b-2xl"></div>
                    </div>
                    
                    <!-- Video Area Placeholder -->
                    <div class="flex-1 bg-gradient-to-b from-gray-800 to-black relative flex items-center justify-center overflow-hidden">
                        
                        <!-- Simulated Video BG -->
                        <img x-show="selectedVideo" :src="selectedVideo ? selectedVideo.thumbnail : ''" class="absolute inset-0 w-full h-full object-cover opacity-50 blur-sm mix-blend-overlay">
                        
                        <!-- Play Icon -->
                        <svg class="w-16 h-16 text-white/40 relative z-10" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                        
                        <!-- Overlay UI (Tiktok style) -->
                        <div class="absolute right-3 bottom-24 flex flex-col space-y-5 items-center z-20">
                            <div class="w-11 h-11 rounded-full bg-white border-2 border-white overflow-hidden p-0.5">
                                <img src="https://ui-avatars.com/api/?name=DAFA&background=000&color=fff" class="rounded-full w-full h-full">
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="w-9 h-9 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center mb-1"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd"></path></svg></div>
                                <span class="text-[10px] text-white font-bold drop-shadow-md">12.5K</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="w-9 h-9 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center mb-1"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M18 10c0 3.866-3.582 7-8 7a8.841 8.841 0 01-4.083-.98L2 17l1.338-3.123C2.493 12.767 2 11.434 2 10c0-3.866 3.582-7 8-7s8 3.134 8 7zM7 9H5v2h2V9zm8 0h-2v2h2V9zM9 9h2v2H9V9z" clip-rule="evenodd"></path></svg></div>
                                <span class="text-[10px] text-white font-bold drop-shadow-md">456</span>
                            </div>
                            <div class="flex flex-col items-center">
                                <div class="w-9 h-9 rounded-full bg-black/20 backdrop-blur-md flex items-center justify-center"><svg class="w-5 h-5 text-white" fill="currentColor" viewBox="0 0 20 20"><path d="M15 8a3 3 0 10-2.977-2.63l-4.94 2.47a3 3 0 100 4.319l4.94 2.47a3 3 0 10.895-1.789l-4.94-2.47a3.027 3.027 0 000-.74l4.94-2.47C13.456 7.68 14.19 8 15 8z"></path></svg></div>
                            </div>
                        </div>

                        <!-- Caption Overlay -->
                        <div class="absolute bottom-4 left-3 right-16 text-white z-20 space-y-1.5">
                            <p class="font-bold text-sm drop-shadow-md">@dafa.glass</p>
                            <p class="text-xs line-clamp-3 drop-shadow-md leading-relaxed" x-text="caption || 'Nội dung caption sẽ hiển thị ở đây khi bạn nhập bên trái...'"></p>
                            <div class="flex items-center space-x-2 text-[11px] font-bold mt-2 bg-black/20 inline-flex px-2 py-1 rounded-full backdrop-blur-sm">
                                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"></path></svg>
                                <span>Âm thanh gốc - DAFA Glass</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Admin Action -->
                <div class="w-full mt-8 space-y-3 shrink-0">
                    <template x-if="selectedVideo && selectedVideo.postUrl">
                        <div class="p-3.5 rounded-xl bg-emerald-500/10 border border-emerald-500/30 text-xs text-emerald-400 flex items-center justify-between shadow-lg">
                            <span class="flex items-center gap-1.5 font-bold">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                Đã xuất bản lên kênh
                            </span>
                            <a :href="selectedVideo.postUrl" target="_blank" class="underline font-bold text-white hover:text-emerald-300">Xem video trên kênh &rarr;</a>
                        </div>
                    </template>

                    <div class="mb-4">
                        <label class="block text-xs font-bold text-gray-400 mb-2 uppercase tracking-widest">Lịch Đăng Tự Động (Tùy chọn)</label>
                        <input type="datetime-local" x-model="scheduledDate" class="w-full bg-black/50 border border-white/10 rounded-xl px-4 py-3 text-white focus:ring-2 focus:ring-orange-500 outline-none transition-all shadow-inner font-mono text-sm [color-scheme:dark]" @click="$el.showPicker && $el.showPicker()">
                    </div>

                    <!-- Nút Đăng Ngay -->
                    <button @click="publishNow()" :disabled="isPublishing" class="w-full py-4 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-black text-lg rounded-2xl shadow-[0_0_20px_rgba(16,185,129,0.35)] transition-all flex justify-center items-center space-x-2 transform hover:-translate-y-1 disabled:opacity-50">
                        <svg x-show="!isPublishing" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        <svg x-show="isPublishing" class="w-6 h-6 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
                        <span x-text="isPublishing ? 'Đang kết nối API & tải video lên kênh...' : '🚀 Đăng Ngay Lên Kênh'"></span>
                    </button>

                    <!-- Nút Lên Lịch Đăng -->
                    <button @click="schedulePublish()" :disabled="isScheduling" class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-rose-600 hover:from-orange-400 hover:to-rose-500 text-white font-bold text-base rounded-2xl shadow-[0_0_20px_rgba(249,115,22,0.3)] transition-all flex justify-center items-center space-x-2 disabled:opacity-50">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        <span x-text="isScheduling ? 'Đang xử lý...' : '📅 Lưu & Lên Lịch Đăng'"></span>
                    </button>

                    <button @click="deleteVideo()" class="w-full py-2.5 bg-red-500/10 hover:bg-red-500/20 text-red-400 font-bold text-sm rounded-2xl transition-all border border-red-500/20 flex items-center justify-center space-x-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        <span>Xóa Video</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

  width: 6px;

.custom-scrollbar::-webkit-scrollbar-track {
  background: transparent;

  background-color: rgba(255, 255, 255, 0.1);
  border-radius: 10px;
}
.custom-scrollbar:hover::-webkit-scrollbar-thumb {
  background-color: rgba(255, 255, 255, 0.2);
}

<script>
function videoStudioData() {
    return {
        filterStatus: 'Tất cả',
        filterTime: '',
        scheduledDate: '',
        isPublishing: false,
        isScheduling: false,
        videos: [],
        allChannels: [],
        campaignIdMap: {},
        init() {
            this.loadChannels().then(() => {
                this.loadCampaigns().then(() => {
                    this.loadData();
                });
            });
        },
        async loadChannels() {
            try {
                const res = await fetch('/api/v1/video-channels/', { headers: { "Authorization": "Bearer " + localStorage.getItem("token") } });
                if(res.ok) {
                    this.allChannels = await res.json();
                    if(this.allChannels.length > 0) this.publishChannel = this.allChannels[0].id;
                }
            } catch(e){}
        },
        async loadCampaigns() {
            try {
                const res = await fetch('/api/v1/campaigns/?type=Video', { headers: { "Authorization": "Bearer " + localStorage.getItem("token") } });
                if (res.ok) {
                    const data = await res.json();
                    data.forEach(c => this.campaignIdMap[c.id] = c.name);
                }
            } catch(e){}
        },
        async loadData() {
            try {
                const res = await fetch('/api/v1/video-plans/', { headers: { "Authorization": "Bearer " + localStorage.getItem("token") } });
                if(res.ok) {
                    const data = await res.json();
                    this.videos = data.filter(p => ['ReadyToPublish', 'InProduction', 'Scheduled', 'Published'].includes(p.status)).map(p => {
                        let plats = [];
                        try { plats = JSON.parse(p.target_platforms || '[]'); } catch(e){}
                        let cName = this.allChannels.find(c => c.id === p.channel_id)?.name || 'Chưa phân bổ';
                        let campName = this.campaignIdMap[p.campaign_id] || 'Chiến dịch';
                        return {
                            id: p.id,
                            title: p.title,
                            campaign: campName,
                            duration: '00:00',
                            fileName: p.status === 'ReadyToPublish' ? 'video_uploaded.mp4' : 'Chưa tải lên',
                            thumbnail: p.thumbnail_url || '',
                            platform: plats[0] || 'TikTok',
                            channel: cName,
                            status: p.status,
                            date: p.optimal_post_time ? p.optimal_post_time.split('T')[0] : '',
                            full_date: p.optimal_post_time ? p.optimal_post_time.substring(0, 16) : '',
                            savedCaption: p.saved_caption || '',
                            image_prompt: p.thumbnail_prompt || ''
                        };
                    });
                    if(this.videos.length > 0) this.selectVideo(this.videos[0]);
                }
            } catch(e){}
        },
        get filteredVideos() {
            return this.videos.filter(v => {
                let s = this.filterStatus === 'Tất cả' || v.status === this.filterStatus;
                let t = true;
                if(this.filterTime && this.filterTime !== 'Tất cả' && v.date) {
                    const vd = new Date(v.date);
                    const now = new Date();
                    if(this.filterTime === 'Hôm nay') {
                        t = vd.toDateString() === now.toDateString();
                    } else if(this.filterTime === 'Tuần này') {
                        const diff = now - vd;
                        t = diff >= 0 && diff <= 7 * 24 * 60 * 60 * 1000;
                    } else if(this.filterTime === 'Tháng này') {
                        t = vd.getMonth() === now.getMonth() && vd.getFullYear() === now.getFullYear();
                    } else if(this.filterTime === '30 ngày qua') {
                        const diff = now - vd;
                        t = diff >= 0 && diff <= 30 * 24 * 60 * 60 * 1000;
                    }
                }
                return s && t;
            });
        },
        selectedVideo: null,
        publishChannel: null,
        caption: '',
        scheduledDate: '',
        selectVideo(v) {
            this.selectedVideo = v;
            this.caption = v.savedCaption || '';
            this.scheduledDate = v.full_date || '';
            let c = this.allChannels.find(ch => ch.name === v.channel);
            if(c) this.publishChannel = c.id;
        },
        handleFileUpload(event) {
            const file = event.target.files[0];
            if(file && this.selectedVideo) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    this.selectedVideo.thumbnail = e.target.result;
                    window.showToast?.('Đã tải ảnh bìa thành công!', 'success');
                };
                reader.readAsDataURL(file);
            }
        },
        async handleVideoUpload(event) {
            const file = event.target.files[0];
            if(file && this.selectedVideo) {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('plan_id', this.selectedVideo.id);
                
                window.showToast?.('Đang tải video lên...', 'info');
                try {
                    const res = await fetch('/api/v1/video-contents/upload', {
                        method: 'POST',
                        body: formData
                    });
                    if (res.ok) {
                        this.selectedVideo.fileName = file.name;
                        this.selectedVideo.status = 'ReadyToPublish';
                        window.showToast?.('Tải video thành công!', 'success');
                    } else {
                        window.showToast?.('Lỗi khi tải video lên', 'error');
                    }
                } catch(e) {
                    window.showToast?.('Lỗi upload', 'error');
                }
            }
        },
        async generateThumbnailAI() {
            if(!this.selectedVideo) return;
            window.showToast?.('AI đang phân tích và tạo ảnh bìa...', 'info');
            try {
                const prompt = this.selectedVideo.image_prompt || 'Video thumbnail';
                const headline = this.selectedVideo.headline || '';
                const res = await fetch('/api/v1/video-contents/generate-thumbnail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: JSON.stringify({ prompt: prompt, headline: headline })
                });
                if(res.ok) {
                    const data = await res.json();
                    this.selectedVideo.thumbnail = data.url;
                    
                    // Save to backend
                    await fetch('/api/v1/video-plans/' + this.selectedVideo.id, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                        body: JSON.stringify({ thumbnail_url: data.url })
                    });
                    
                    window.showToast?.('Tạo ảnh bìa AI thành công!', 'success');
                } else {
                    window.showToast?.('Lỗi khi tạo ảnh AI', 'error');
                }
            } catch(e) {
                console.error(e);
                window.showToast?.('Có lỗi xảy ra', 'error');
            }
        },
        async deleteThumbnail() {
            if(!this.selectedVideo) return;
            this.selectedVideo.thumbnail = '';
            try {
                await fetch('/api/v1/video-plans/' + this.selectedVideo.id, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('token') },
                    body: JSON.stringify({ thumbnail_url: null })
                });
                window.showToast?.('Đã xóa ảnh bìa!', 'info');
            } catch(e){}
        },
        async generateAI() {
            if(!this.selectedVideo) return;
            const selectedChannel = this.allChannels.find(c => c.id == this.publishChannel) || { vibe: 'Chuyên nghiệp' };
            this.caption = "Đang phân tích video và tạo caption AI...";
            try {
                const res = await fetch('/api/v1/video-contents/generate-caption', {
                    method: 'POST',
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        title: this.selectedVideo.title, 
                        vibe: selectedChannel.vibe 
                    })
                });
                if (res.ok) {
                    const data = await res.json();
                    this.caption = data.caption || data;
                    if(this.selectedVideo) this.selectedVideo.savedCaption = this.caption;
                    window.showToast?.('Tạo caption thành công!', 'success');
                } else {
                    window.showToast?.('Lỗi tạo caption', 'error');
                    this.caption = '';
                }
            } catch (err) {
                console.error(err);
                window.showToast?.('Lỗi kết nối API', 'error');
                this.caption = '';
            }
        },
        async publishNow() {
            if(!this.selectedVideo) return;
            if(!this.publishChannel) {
                window.showToast?.('Vui lòng chọn Kênh đăng tải!', 'warning');
                return;
            }
            if(!confirm("Bạn có chắc chắn muốn ĐĂNG NGAY video này lên kênh đã chọn không?")) return;

            this.isPublishing = true;
            window.showToast?.('Đang kết nối API và tải video lên kênh...', 'info');
            try {
                const res = await fetch(`/api/v1/video-contents/plan/${this.selectedVideo.id}/publish-or-schedule`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({
                        channel_id: parseInt(this.publishChannel),
                        caption: this.caption,
                        publish_now: true
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    this.selectedVideo.status = 'Published';
                    this.selectedVideo.postUrl = data.url;
                    window.showToast?.(data.message || 'Đăng video thành công!', 'success');
                    await this.loadData();
                } else {
                    window.showToast?.('Lỗi: ' + (data.detail || 'Không thể đăng video'), 'error');
                }
            } catch (err) {
                console.error(err);
                window.showToast?.('Lỗi kết nối máy chủ: ' + err.message, 'error');
            } finally {
                this.isPublishing = false;
            }
        },
        async schedulePublish() {
            if(!this.selectedVideo) return;
            if(!this.publishChannel) {
                window.showToast?.('Vui lòng chọn Kênh đăng tải!', 'warning');
                return;
            }
            if(!this.scheduledDate) {
                window.showToast?.('Vui lòng chọn thời gian đăng (Lịch đăng)!', 'warning');
                return;
            }

            this.isScheduling = true;
            try {
                const res = await fetch(`/api/v1/video-contents/plan/${this.selectedVideo.id}/publish-or-schedule`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + localStorage.getItem('token')
                    },
                    body: JSON.stringify({
                        channel_id: parseInt(this.publishChannel),
                        scheduled_at: this.scheduledDate,
                        caption: this.caption,
                        publish_now: false
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    this.selectedVideo.status = 'Scheduled';
                    window.showToast?.(data.message || 'Đã lên lịch đăng video!', 'success');
                    await this.loadData();
                } else {
                    window.showToast?.('Lỗi: ' + (data.detail || 'Không thể lên lịch'), 'error');
                }
            } catch (err) {
                console.error(err);
                window.showToast?.('Lỗi kết nối khi lên lịch: ' + err.message, 'error');
            } finally {
                this.isScheduling = false;
            }
        },
        async approvePublish() {
            await this.schedulePublish();
        },
        async deleteVideo() {
            if(!this.selectedVideo) return;
            if(!confirm("Bạn có chắc chắn muốn xóa video này?")) return;
            try {
                const res = await fetch('/api/v1/video-plans/' + this.selectedVideo.id, {
                    method: 'DELETE',
                    headers: { "Authorization": "Bearer " + localStorage.getItem("token") }
                });
                if(res.ok) {
                    window.showToast?.('Đã xóa video thành công', 'success');
                    this.selectedVideo = null;
                    await this.loadData();
                }
            } catch(e) {}
        }
    }
}
</script>
